# WHY this file conflicts so often, and how to resolve it: the two inventory lines
# below are DERIVED from the test fixtures on disk, so any two PRs that each add a
# fixture both rewrite them and collide. BOTH sides of that conflict are wrong --
# taking either one silently drops the other PR's entry, and the result looks entirely
# plausible. Resolve by regenerating after the merge:
#     scripts/check-automation-pr-gates.py --print-sonar-scope
# SonarQube Cloud Automatic Analysis ignores sonar-project.properties. Keep
# Python and shell test fixtures in test scope so production ratings are based
# on production code. Initial roots must be literal. Explicit fixture entries
# let default-branch scope bootstrap precede a fixture; the required gate
# validates exact inventory once that fixture exists.
sonar.sources=.
sonar.tests=scripts
