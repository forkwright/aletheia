# UNSUPPORTED BEFORE v1.0
# This file is an example of a planned declarative shell hook.
# The current Aletheia runtime uses in-process turn hooks (crates/nous/src/hooks)
# and does NOT load or execute YAML/shell hook files.
#
# Example: Log every turn completion to a file

name: log-turns
event: turn:after
description: Append turn metadata to a daily log file

# WARNING: nous and session IDs and token counts are operational metadata, so
# the log goes to the per-user state directory that scripts/health-monitor.sh
# already uses, created mode 0700. A fixed name under the shared temp root
# would be world-readable, would belong to whichever account created it first,
# and is open to symlink attack.
handler:
  type: shell
  command: /bin/sh
  args: ["-c", "d=\"${ALETHEIA_LOG_DIR:-${XDG_STATE_HOME:-$HOME/.local/state}/aletheia}\"; mkdir -p \"$d\" && chmod 700 \"$d\" && echo \"$(date -u +\"%Y-%m-%dT%H:%M:%SZ\") {{nousId}} {{sessionId}} tokens_in={{inputTokens}} tokens_out={{outputTokens}} tools={{toolCalls}}\" >> \"$d/turns.log\""]
  timeout: 5s
  failAction: silent
