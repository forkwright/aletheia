groups:
  - name: aletheia
    interval: 15s
    rules:
      - alert: AletheiaDown
        expr: up{job="aletheia"} == 0 or absent(aletheia_uptime_seconds)
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Aletheia metrics endpoint is unreachable or process is down"
          runbook_url: "../docs/OBSERVABILITY.md#aletheiadown"

      - alert: HighHttpErrorRate
        expr: |
          (
            rate(aletheia_http_requests_total{status=~"5.."}[5m])
            /
            rate(aletheia_http_requests_total[5m])
          ) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "HTTP 5xx error rate exceeds 5% over 5 minutes"
          runbook_url: "../docs/OBSERVABILITY.md#highhttperrorrate"

      - alert: SlowLlmLatency
        expr: |
          histogram_quantile(0.95,
            rate(aletheia_llm_request_duration_seconds_bucket[5m])
          ) > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM request p95 latency exceeds 30 seconds for 5 minutes"
          runbook_url: "../docs/OBSERVABILITY.md#slowllmlatency"

      - alert: LlmCircuitBreakerOpen
        expr: |
          increase(aletheia_llm_circuit_breaker_transitions_total{to="down"}[5m]) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "LLM provider circuit breaker opened"
          runbook_url: "../docs/OBSERVABILITY.md#llmcircuitbreakeropen"

      # Freshness comes from the newest backup manifest on disk, not from this
      # process's attempt counter. A counter-based rule went silent exactly when
      # it mattered: with no successful backup ever, or after a restart, the
      # status="ok" series does not exist and `increase(...) == 0` matches
      # nothing instead of alerting. (#6445)
      - alert: BackupMissing
        expr: |
          aletheia_backup_enabled == 1
            and aletheia_backup_last_success_unixtime_seconds == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Backups are enabled but no valid backup set exists on disk"
          runbook_url: "../docs/OBSERVABILITY.md#backupmissing"

      - alert: BackupStale
        expr: |
          aletheia_backup_enabled == 1
            and aletheia_backup_last_success_unixtime_seconds > 0
            and (time() - aletheia_backup_last_success_unixtime_seconds)
                > (2 * aletheia_backup_interval_seconds)
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Newest backup is older than twice the configured backup interval"
          runbook_url: "../docs/OBSERVABILITY.md#backupstale"

      - alert: BackgroundTaskFailures
        expr: |
          rate(aletheia_background_task_failures_total[5m]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Background task failures detected in the last 5 minutes"
          runbook_url: "../docs/OBSERVABILITY.md#backgroundtaskfailures"

      - alert: WatchdogHungProcesses
        expr: aletheia_watchdog_hung_processes > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "One or more watchdog-monitored processes are hung"
          runbook_url: "../docs/OBSERVABILITY.md#watchdoghungprocesses"

      - alert: StreamEventsDropped
        expr: |
          rate(aletheia_stream_events_dropped_total[5m]) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Streaming events are being dropped"
          runbook_url: "../docs/OBSERVABILITY.md#streameventsdropped"

      # WHY the thresholds: 0.4 mirrors the client-side "unhealthy" band
      # theatron/proskenion's health_score_color already uses (score < 0.4
      # renders var(--status-error)); this is the same score computed
      # server-side (koina::memory_health::compute_health_score), so the
      # alert threshold and the UI's own red band agree by construction.
      - alert: MemoryHealthScoreLow
        expr: aletheia_memory_health_score < 0.4
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "Composite memory health score has been below 0.4 for 30 minutes"
          runbook_url: "../docs/OBSERVABILITY.md#memoryhealthscorelow"

      - alert: MemoryOrphanRatioHigh
        expr: aletheia_memory_orphan_ratio > 0.2
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Over 20% of entities have no relationship and no fact link"
          runbook_url: "../docs/OBSERVABILITY.md#memoryorphanratiohigh"

      - alert: MemoryStalenessRatioHigh
        expr: aletheia_memory_staleness_ratio > 0.15
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Over 15% of active facts are stale (unreviewed past the staleness threshold)"
          runbook_url: "../docs/OBSERVABILITY.md#memorystalenessratiohigh"
