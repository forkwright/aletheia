# Release feature gates are derived from Cargo metadata. This manifest only
# records intentional policy exceptions and feature combinations that metadata
# cannot infer by itself.

[[feature_exclusions]]
crate = "*"
feature = "default"
category = "covered-by-default-gates"
reason = "Default feature sets are covered by the workspace test and release build jobs; the release feature matrix focuses on optional feature surfaces."

[[feature_exclusions]]
crate = "*"
feature = "online-tests"
category = "network"
reason = "Network-dependent test features are exercised by .github/workflows/online-tests.yml instead of release tag builds."

[[feature_exclusions]]
crate = "*"
feature = "test-full"
category = "expensive"
reason = "Full ML/network test tiers are scheduled and label-triggered in .github/workflows/online-tests.yml; release tags keep deterministic test-core coverage."

# A feature that activates nothing and that no `cfg(feature = ...)` in its own
# crate reads gates nothing at all. These entries record the shapes where that
# is intentional; everything else is a defect the validator rejects.

[[no_op_allowances]]
crate = "*"
feature = "default"
category = "empty-default"
reason = "An empty default feature set is a positive declaration that the crate opts into nothing by default; there is no behaviour for a cfg to gate."

[[no_op_allowances]]
crate = "*"
feature = "test-core"
category = "uniform-test-tier"
reason = "Test tiers are declared on every workspace member so `--workspace --features test-core` resolves uniformly; crates with no tier-specific code carry the marker without a cfg."

[[no_op_allowances]]
crate = "*"
feature = "test-full"
category = "uniform-test-tier"
reason = "Test tiers are declared on every workspace member so `--workspace --features test-full` resolves uniformly; crates with no tier-specific code carry the marker without a cfg."

[[no_op_allowances]]
crate = "*"
feature = "test-support"
category = "uniform-test-tier"
reason = "Test-helper gate declared uniformly across crates; where a crate exposes no helpers the marker exists so dependants can name the feature unconditionally."

[[no_default_recipes]]
name = "bare-minimum"
crate = "aletheia"
features = []
reason = "Bare minimum: no TUI, no recall wiring, no ML, no Claude Code provider."

[[no_default_recipes]]
name = "minimal-headless-tls"
crate = "aletheia"
features = ["tls"]
reason = "Minimal headless deployment: HTTP API plus TLS, no recall wiring or ML stack."

[[no_default_recipes]]
name = "headless-tls-keyring"
crate = "aletheia"
features = ["tls", "keyring"]
reason = "Headless deployment with keyring-backed auth, still without ML."

[[no_default_recipes]]
name = "minimal-mcp"
crate = "aletheia"
features = ["mcp"]
reason = "Minimal MCP server recipe with the recall wiring required by knowledge tools."

[[no_default_recipes]]
name = "full-headless"
crate = "aletheia"
features = ["recall", "storage-fjall", "embed-candle", "cc-provider", "tls"]
reason = "Full headless deployment: recall plus ML plus Claude Code provider and TLS, no TUI."
