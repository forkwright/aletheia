[licenses]
# WHY: `version = 2` enables modern SPDX 3.x parsing so "AGPL-3.0-or-later" /
# "LGPL-3.0-or-later" are accepted as bare license identifiers. Without this,
# the legacy parser rejects them with "expected a <bare-gnu-license>".
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "AGPL-3.0-or-later",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",              # option-ext, smartstring
    "LGPL-3.0-or-later",    # priority-queue
    "CDLA-Permissive-2.0",  # webpki-roots, webpki-root-certs
    "bzip2-1.0.6",          # libbz2-rs-sys (via zip 7.x), standalone bzip2 license
    # Apache-2.0 with LLVM's additional permission for compiled output.
    # Pulled in by typst-eval -> stacker -> psm -> ar_archive_writer (build).
    # LLVM exception is a superset of Apache-2.0 (strictly more permissive).
    "Apache-2.0 WITH LLVM-exception",
]
confidence-threshold = 0.8

# WHY a per-crate exception, not a blanket `allow` entry: koinon is
# forkwright's own fleet-scaffolding crate, licensed
# LicenseRef-PolyForm-Noncommercial-1.0.0 — that term is a deliberate choice
# for this crate specifically, not a license class any third-party
# dependency should get to walk in under. Scoping the allowance to `koinon`
# by name keeps a genuinely unusual (and, for a random future dependency,
# disqualifying) license from silently passing for anything else.
[[licenses.exceptions]]
name = "koinon"
allow = ["LicenseRef-PolyForm-Noncommercial-1.0.0"]

# WHY (aletheia#4726): libfuzzer-sys's own license expression is
# "(MIT OR Apache-2.0) AND NCSA" — MIT alone already satisfies the OR half
# (both MIT and Apache-2.0 are in the global allow list above), so only
# NCSA needs the per-crate exception. It arrives transitively via
# rav1e -> ravif -> image, which dioxus-desktop (proskenion's desktop UI
# toolkit) unifies into the shared `image` dependency with AVIF decoding
# enabled; libfuzzer-sys itself is rav1e's fuzz-target scaffolding, never
# invoked at runtime, and NCSA is both OSI-approved and FSF Free/Libre.
[[licenses.exceptions]]
name = "libfuzzer-sys"
allow = ["MIT", "NCSA"]

[bans]
multiple-versions = "warn"
wildcards = "allow"
# Skip entries for duplicates caused by upstream constraints we cannot resolve.
# Each entry exempts the named version from the multiple-versions check.
# The newer/canonical version is not listed here and is kept as-is.
#
# Canonical versions: windows-sys 0.61, windows-targets 0.53, arch crates 0.53.
# Older versions are pulled in by transitive deps that haven't migrated yet.
skip = [
    # WHY: jni 0.21 (via rustls-platform-verifier) pins windows-sys 0.45.
    # Blocked until rustls-platform-verifier drops jni or jni upgrades.
    { name = "windows-sys", version = "=0.45.0" },

    # WHY: ring 0.17 pins windows-sys 0.52.
    # Blocked until ring releases a version using windows-sys 0.61.
    { name = "windows-sys", version = "=0.52.0" },

    # WHY: arboard 3.6 (via parodos) pins windows-sys 0.60.
    # Blocked until arboard releases a version using windows-sys 0.61.
    { name = "windows-sys", version = "=0.60.2" },

    # WHY: windows-targets follows windows-sys version spread above.
    # 0.42 from windows-sys 0.45 (jni chain).
    # 0.52 from windows-sys 0.52 (ring chain).
    { name = "windows-targets", version = "=0.42.2" },
    { name = "windows-targets", version = "=0.52.6" },

    # WHY: arch-specific crates follow windows-targets versions above.
    { name = "windows_aarch64_gnullvm", version = "=0.42.2" },
    { name = "windows_aarch64_gnullvm", version = "=0.52.6" },
    { name = "windows_aarch64_msvc", version = "=0.42.2" },
    { name = "windows_aarch64_msvc", version = "=0.52.6" },
    { name = "windows_i686_gnu", version = "=0.42.2" },
    { name = "windows_i686_gnu", version = "=0.52.6" },
    { name = "windows_i686_gnullvm", version = "=0.52.6" },
    { name = "windows_i686_msvc", version = "=0.42.2" },
    { name = "windows_i686_msvc", version = "=0.52.6" },
    { name = "windows_x86_64_gnu", version = "=0.42.2" },
    { name = "windows_x86_64_gnu", version = "=0.52.6" },
    { name = "windows_x86_64_gnullvm", version = "=0.42.2" },
    { name = "windows_x86_64_gnullvm", version = "=0.52.6" },
    { name = "windows_x86_64_msvc", version = "=0.42.2" },
    { name = "windows_x86_64_msvc", version = "=0.52.6" },

    # WHY: spm_precompiled 0.1.4 (via tokenizers/aletheia-episteme) pins base64 0.13.
    # spm_precompiled is unmaintained (last release 2022-05-30). Blocked until
    # tokenizers replaces or forks spm_precompiled with a base64 0.22+ compatible
    # version. Tracked in #2079.
    { name = "base64", version = "=0.13.1" },

    # WHY: older crypto crates (aes/sha family) pin cpufeatures 0.2.
    # Blocked until those crates release versions using cpufeatures 0.3.
    { name = "cpufeatures", version = "=0.2.17" },

    # WHY: derive_builder_core pins the darling 0.20 proc-macro suite.
    # Blocked until derive_builder migrates to darling 0.23.
    { name = "darling", version = "=0.20.11" },
    { name = "darling_core", version = "=0.20.11" },
    { name = "darling_macro", version = "=0.20.11" },

    # WHY: tokenizers pins fancy-regex 0.14; syntect pins 0.16.
    # Canonical: 0.17 (candle-transformers). Blocked on upstream migrations.
    { name = "fancy-regex", version = "=0.14.0" },
    { name = "fancy-regex", version = "=0.16.2" },

    # WHY: rand 0.8/0.9 ecosystem chains pull in getrandom 0.2/0.3 respectively.
    # Canonical: getrandom 0.4 (rand 0.10). Blocked on full rand ecosystem upgrade.
    { name = "getrandom", version = "=0.2.17" },
    { name = "getrandom", version = "=0.3.4" },

    # WHY: dashmap (via fjall/aletheia-krites storage engine) pins hashbrown 0.14.
    # Blocked until dashmap migrates to hashbrown 0.16.
    { name = "hashbrown", version = "=0.14.5" },

    # WHY: getrandom 0.3 chain uses r-efi 5.x; getrandom 0.4 uses r-efi 6.x.
    # Eliminated once getrandom 0.3 skip entry above takes effect.
    { name = "r-efi", version = "=5.3.0" },

    # WHY: some deps have not yet migrated to rand 0.10 (e.g., rmcp uses 0.10,
    # while older audio/crypto crates still pull rand 0.9).
    # Blocked until all transitive deps migrate to rand 0.10.
    { name = "rand", version = "=0.9.4" },

    # WHY: password-hash pins rand_core 0.6; rand 0.9 chain uses rand_core 0.9.
    # Canonical: rand_core 0.10 (rand 0.10). Blocked on rand ecosystem upgrade.
    { name = "rand_core", version = "=0.6.4" },
    { name = "rand_core", version = "=0.9.5" },

    # WHY: procfs (prometheus metrics client) pins rustix 0.38.
    # Blocked until prometheus/procfs upgrades to rustix 1.x.
    # (See also windows-sys 0.59 skip above — same dep chain.)
    { name = "rustix", version = "=0.38.44" },

    # WHY: toml 0.8 (figment dependency) uses serde_spanned 0.6; toml 1.x uses 1.x.
    # Same root cause as the toml/toml_datetime skips below.
    { name = "serde_spanned", version = "=0.6.9" },

    # WHY: various transitive deps have not yet migrated to thiserror v2.
    # Blocked until upstream crates release versions using thiserror 2.x.
    { name = "thiserror", version = "=1.0.69" },
    { name = "thiserror-impl", version = "=1.0.69" },
]

# WHY: "pure Rust, no C++" — rustls replaces openssl across the workspace.
# WHY: pandoc must stay an external subprocess so we keep the GPL-clean
# boundary and never link a pandoc Rust binding into the binary.
#
# WHY wrappers = ["openssl", "native-tls"] (aletheia#4726): dioxus-desktop
# (proskenion's desktop UI toolkit) hardcodes
# `tungstenite = { features = ["native-tls"] }` for its devtools hot-reload
# websocket on non-Android targets -- upstream, not something our own
# Cargo.toml feature selection controls. openssl-sys has two direct parents
# in the resolved graph: the `openssl` safe wrapper (normal dependency) and
# `native-tls` itself (a direct build-dependency on openssl-sys alongside
# openssl, for its own build-script probing) -- cargo-deny requires every
# direct parent named as a wrapper, not just the outermost one. No aletheia
# crate depends on openssl-sys directly or reaches it by any other path; the
# "pure Rust, no C++" posture stays the rule everywhere else
# (reqwest/rustls across the workspace, see [workspace.dependencies]
# rustls). Revisit if dioxus-desktop ever exposes a rustls-backed devtools
# transport; tracked as part of the proskenion-lints follow-up (see
# crates/theatron/proskenion/Cargo.toml WHY comment).
[[bans.deny]]
crate = "openssl-sys"
wrappers = ["openssl", "native-tls"]

[[bans.deny]]
crate = "pandoc"
reason = "Aletheia shells out to pandoc as a subprocess; do not link the pandoc crate into the binary."

[[bans.deny]]
crate = "pandoc_ast"
reason = "Pandoc AST bindings must stay outside the build; Aletheia uses pandoc as an external subprocess only."

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# WHY: skene/koilon/theatron pull keryx + parodos from GitHub (forkwright/theatron
# tagged releases). These are first-party crates in the fleet mono-repo constellation;
# git sources are expected until crates.io publication is decided.
allow-org.github = ["forkwright"]

[[advisories.ignore]]
id = "RUSTSEC-2026-0206"
reason = "rustybuzz unmaintained (maintenance-status only, no vuln). Transitive GUI text-shaping via theatron (parley/vello, Dioxus-native+Blitz). No maintained successor; not a security surface. Matches the theatron ignore + existing precedent."

# WHY the next two entries (aletheia#4726): both are `informational = "unsound"`
# advisories, which cargo-deny does not fail on by default (same class as the
# memmap2 entry above) -- listed here anyway to keep osv-scanner.toml (which
# fails on ANY finding via --fail-on-vuln=true, informational included) in
# sync via `kanon audit derive-ignores --apply`.
[[advisories.ignore]]
id = "RUSTSEC-2024-0429"
reason = "glib::VariantStrIter unsound Iterator impl (fixed >=0.20.0) -- glib 0.18.5 is pinned by the whole gtk-rs 0.18 release train (gtk/gdk/gio/pango/cairo-rs/webkit2gtk/atk), which dioxus-desktop 0.7.10 (proskenion's desktop UI toolkit) depends on; bumping requires that entire third-party stack to release together, not something this crate's dependents control. proskenion's own source never uses VariantStrIter directly."

[[advisories.ignore]]
id = "RUSTSEC-2026-0097"
reason = "rand::thread_rng() unsound only when the `log` feature is enabled AND a custom logger calls back into ThreadRng during a reseed (fixed >=0.8.6) -- transitive via selectors -> kuchikiki -> wry -> dioxus-desktop -> dioxus (phf_generator's compile-time perfect-hash-table codegen, itself only reachable as a build-time helper of `selectors`); no custom log integration touches this path, and phf_generator has no upgrade path off its `rand = \"^0.7\"` pin without a coordinated upstream release."
