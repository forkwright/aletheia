# Restrict SonarCloud to Rust source and Python script files.
# Workspace-member Cargo.toml files trigger a false "lock file missing" SCA
# finding because SonarCloud does not understand that the workspace root
# Cargo.lock covers all members. By using sonar.inclusions we only surface
# the root-level Cargo.toml (which does sit next to Cargo.lock) and all
# .rs / .py sources. Code quality for the new crates is covered by
# cargo clippy and cargo nextest in CI.
sonar.inclusions=**/*.rs, **/*.py, Cargo.toml, Cargo.lock

# WARNING: a PR that only MOVES or RENAMES files fails the "Maintainability
# Rating on New Code" condition, and the failure says nothing about the change.
# A moved file's whole content is attributed to new code, so the rating is
# computed over code that already sits on main at that grade. Observed twice:
# #6692 (17 source files at +0/-0) and #6695, both "B ... on New Code"; six
# content PRs merged over the same window passed. This check is ADVISORY --
# branch protection requires only gate, cargo audit, cargo deny -- so on a
# rename-only PR, confirm the diff is genuinely content-free and merge on the
# required set. The new-code definition lives in SonarCloud project settings,
# not in this file, so it cannot be corrected here.
