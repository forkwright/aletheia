[meta]
name = "aletheia"
repo = "forkwright/aletheia"
generated = false
source_docs = [
  "docs/PROJECT.md",
  "CHANGELOG.md",
  ".release-please-manifest.json",
]

[state]
phase = "pre-1.0"
version = "0.37.0"
summary = """
Aletheia is in active pre-1.0 development. The core agent runtime, memory
pipeline, tool registry, HTTP/SSE gateway, Signal channel, and TUI are
production-quality. The desktop app (proskenion) is a source-built preview and
is not the default onboarding path. The v1.0 milestone targets the desktop app
as the primary operator surface.
"""

[interfaces]
tui = "active"
signal = "active"
http_api = "active"
desktop_app = "preview"

# WHY(#4527): milestones/active-thread tracking is intentionally NOT
# duplicated here -- docs/PROJECT.md's own "Milestones" section states
# "Planning and milestones are tracked in the internal project roadmap." A
# hand-maintained thread list in this public file drifts from that private
# roadmap silently (the prior version named specific in-flight work items
# that had already gone stale) with no mechanism to catch it. `version`
# above stays because it is mechanically checkable against
# .release-please-manifest.json; free-text planning state is not.
