# WHY: pinned to an exact release rather than the floating `stable` channel so
# release/security/gate CI resolves the same compiler on every run instead of
# picking up whatever stable shipped that day (#4945). This is the SSOT for
# the Rust toolchain identity; workflow steps fall through to it rather than
# repeating `toolchain: stable` in their own `with:` blocks.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
