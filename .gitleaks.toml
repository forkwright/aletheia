title = "Aletheia gitleaks config"

# Extend the default ruleset
[extend]
useDefault = true

# Custom rules for Aletheia-specific patterns
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key"
regex = '''sk-ant-[a-zA-Z0-9_-]{90,}'''
tags = ["key", "anthropic"]

[[rules]]
id = "signal-cli-password"
description = "Signal CLI registration password"
regex = '''signal-cli.*password["\s:=]+[^\s"]{8,}'''
tags = ["password", "signal"]

[[rules]]
id = "phone-number"
description = "Phone number (US format)"
regex = '''\+1[0-9]{10}'''
tags = ["pii", "phone"]

[[rules]]
id = "jwt-secret"
description = "JWT secret or token"
regex = '''eyJ[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}\.[A-Za-z0-9_-]{20,}'''
tags = ["token", "jwt"]

# Allowlisted paths — instance/ is gitignored so shouldn't appear,
# but be defensive
[allowlist]
paths = [
  '''vendor/''',
  '''crates/mneme-engine/''',
  '''\.gitleaks\.toml''',
  '''docs/SECURITY\.md''',
  '''SECURITY\.md''',
  '''docs/DEPLOYMENT\.md''',
  '''docs/CONFIGURATION\.md''',
  # WHY: build artifacts contain hash-like strings in LTO bytecode and compiled
  # metadata (e.g. struct field names, OpenSSL constants) that trigger
  # generic-api-key and private-key rules. Gitignored but visible to --no-git.
  '''target/''',
  # WHY: redact.rs files contain intentional fake credentials for PII-scrubbing tests.
  '''crates/[^/]+/src/redact\.rs''',
  # WHY: PII-redaction tests contain intentional synthetic secret and phone shapes.
  '''crates/nous/src/training/pii\.rs''',
  # WHY: credential API tests use synthetic token-like values and assert redaction.
  '''crates/pylon/src/tests/credentials\.rs''',
  '''crates/pylon/src/handlers/health\.rs''',
  # WHY: local dispatch transcripts are gitignored and may contain scanner output.
  '''^\.dispatch.*''',
  # WHY: runbook and checklist contain example CLI commands with synthetic values.
  '''docs/RUNBOOK\.md''',
  '''docs/CUTOVER_CHECKLIST\.md''',
  # WHY: quickstart contains synthetic Signal examples already marked for the PII scanner.
  '''docs/QUICKSTART\.md''',
  # WHY: spec documents use example phone numbers and tokens for illustration.
  '''docs/specs/''',
  # WHY: infrastructure/runtime contains docs, i18n translation files, and test
  # fixtures for the runtime sub-project. None hold real secrets.
  '''infrastructure/runtime/''',
  # WHY: prosoche config examples demonstrate operator configuration with fake values.
  '''infrastructure/prosoche/''',
  # WHY: training-pipeline tests build synthetic preference/record fixtures whose
  # generated content is high-entropy enough to trip generic-api-key. The sibling
  # training/pii.rs is already allowlisted for the same reason.
  '''crates/nous/src/training/mod\.rs''',
  '''crates/nous/src/training/dpo\.rs''',
  # WHY: idempotency tests post synthetic request bodies (literally "synthetic
  # contents") and a fixed bearer token, matching the already-allowlisted
  # crates/pylon/src/tests/credentials.rs.
  '''crates/pylon/src/tests/idempotency\.rs''',
  # WHY: Signal account tests use +15551234567 -- the NANP-reserved 555 range,
  # already carrying `pii-allow:` markers at every site. The phone-number rule
  # above cannot distinguish a reserved test number from a real one.
  '''crates/taxis/src/config/config_tests/basics\.rs''',
  '''crates/aletheia/src/runtime/setup\.rs''',
  # WHY: both files were deleted from the tree in the clean-room rewrite
  # (9387f016c) and survive only in history, which gitleaks scans in full.
  # mcporter.json:36 held a Todoist API token committed in the 2026-02-05
  # bootstrap; that credential has been REVOKED and no longer verifies -- see
  # the trufflehog job, which passes on the same history because it only fails
  # on live credentials. Rewriting history would not un-expose a token already
  # published from a public repo, so the credential was killed at the source
  # instead. These entries keep a permanently-unfixable historical match from
  # holding the scan red, which is how a genuinely new leak would get ignored.
  '''shared/config/mcporter\.json''',
  '''shared/bin/nous-health''',
]
