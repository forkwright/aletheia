reason = "rand::thread_rng() unsound only when the `log` feature is enabled AND a custom logger calls back into ThreadRng during a reseed (fixed >=0.8.6) -- transitive via selectors -> kuchikiki -> wry -> dioxus-desktop -> dioxus (phf_generator's compile-time perfect-hash-table codegen, itself only reachable as a build-time helper of `selectors`); no custom log integration touches this path, and phf_generator has no upgrade path off its `rand = "^0.7"` pin without a coordinated upstream release."
