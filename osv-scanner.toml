id = "RUSTSEC-2026-0235"
reason = "rkyv out-of-bounds read on archives containing Rc/Arc with mismatched pointer metadata — transitive only: rust_decimal 1.42.1 → spreadsheet-ods + typst-library, both document-generation deps of poiesis. Patched is rkyv >= 0.8.17, a major bump three levels up: rust_decimal's optional archive support must move to 0.8 first, then spreadsheet-ods and typst-library. Not reachable here — the flaw requires DESERIALIZING an untrusted rkyv archive, and no aletheia crate uses rkyv (zero matches under crates/); it is linked only because rust_decimal offers archive support to those two crates. Revisit when rust_decimal ships rkyv 0.8. Tracked in #6606"

