# archetype: B
# forge-only: false
# spdx: AGPL-3.0-or-later

# Forge CI pipeline for forkwright/aletheia.
#
# Mirrors harmonia's .kanon-ci.toml with aletheia-specific adjustments:
# feature flag (test-core) and longer timeouts for the larger workspace.
#
# Per-stage build concurrency is pinned below the host CPU count. Without this
# cap, cargo defaults to num_cpus and parallel rustc processes can peak well
# past the runner's available RAM -- enough to OOM the machine when other
# build or CI work runs alongside this one.
#
# Check/clippy keep the 8-job cap. Nextest is pinned tighter
# (`--build-jobs 4 --test-threads 4`) because it can compile and run test
# binaries inside the same scope cgroup. The lower cap is meant to keep red
# main runs attributable to real compile/test failures instead of sccache
# disconnects or stage-level timeouts under shared-host load.
#
# NOTE(aletheia#5328): no literal fleet hostnames/capacity numbers in this file;
# see check_ci_config_hygiene() in scripts/check-public-doc-contracts.py.
#
# Keep in sync with:
# - crates/archeion/src/ci_config.rs::default_rust_gate (upstream default)
#
# NOTE: the duplicate in-repo basanos crate was removed in favor of kanon's
# canonical linter. The full `kanon lint --summary --rust` stage remains
# intentionally omitted because the workspace rust baseline still carries
# non-zero debt (~1500+ violations). Writing and workflow lint are now clean
# and enforced below. Per-crate rust lint gates should be added as individual
# crates reach zero violations (koina is closest). Whole-workspace rust lint
# can be re-added once the baseline is clean. Tracked in the phase plan at
# `<canonical-state-doc>/phases/aletheia-05e-forge-cutover.md`.

[pipeline]
stages = ["cargo fmt", "cargo publish policy", "proskenion flake", "cargo check", "cargo clippy", "cargo nextest", "kanon lint writing", "kanon lint workflow"]

[stages."cargo fmt"]
cmd = "cargo fmt --all -- --check"
timeout_secs = 300

[stages."cargo publish policy"]
cmd = "scripts/check-cargo-publish-policy.py"
timeout_secs = 60

[stages."proskenion flake"]
cmd = "scripts/check-proskenion-flake.py"
timeout_secs = 60

[stages."cargo check"]
cmd = "cargo check --workspace --features test-core --all-targets --jobs 8"
timeout_secs = 1800

[stages."cargo clippy"]
cmd = "cargo clippy --workspace --features test-core --all-targets --jobs 8 -- -D warnings"
timeout_secs = 1800

[stages."cargo nextest"]
cmd = "cargo nextest run --workspace --features test-core --profile ci --build-jobs 4 --test-threads 4 --no-fail-fast"
timeout_secs = 2400

[stages."kanon lint writing"]
cmd = "kanon lint --summary --writing"
timeout_secs = 300

[stages."kanon lint workflow"]
cmd = "kanon lint --summary --workflow"
timeout_secs = 300

# Design-token enforcement (DISABLED, not in [pipeline].stages above):
# every var(--token) reference in CSS or Rust source must resolve to a
# declaration in DESIGN-TOKENS.md, checked by `dokimasia` (theatron).
#
# `archeion::ci_config::validate` rejects an orphaned `[stages.*]` table
# (`ConfigError::UnscheduledStage`), so the stage block itself is held
# out-of-tree here as a comment rather than left defined-but-unlisted:
#
#   [stages."dokimasia"]
#   cmd = "sh -c 'dokimasia --design-tokens \"${DESIGN_TOKENS_PATH:?required}\" crates/'"
#   timeout_secs = 60
#
# The binary is provisioned (theatron v1.6.2 at `~/.local/bin/dokimasia`
# on menos per `boxes/menos/takeover/tools-provenance.md` in the ops
# repo; the CI sandbox's `stage_program_search_paths` in
# `crates/archeion/src/ci/runner_sandbox.rs` resolves `~/.local/bin`,
# never `/usr/local/bin`) and the `cmd` above is shell-wrapped so
# `${DESIGN_TOKENS_PATH:?required}` actually expands (`cmd` is split via
# `shell_words` with no shell involved otherwise -- precedent for the
# wrap: ardent-site, ardent-tools-site, gnomon, thumos `.kanon-ci.toml`).
#
# Re-enable only once BOTH:
#   - aletheia#7362: `.kanon-ci.toml`'s stage schema gains a per-stage
#     `env` field (a kanon-side `archeion::ci_config::StageConfig`
#     change) AND a way for the sandbox to resolve kanon's canonical
#     `DESIGN-TOKENS.md` (a declared mount in `runner_sandbox.rs`, or an
#     aletheia-side vendored + synced copy) -- today's sandbox only
#     binds this checkout, target_dir, /usr, an /etc allowlist, and
#     $CARGO_HOME/$RUSTUP_HOME, so no value for `DESIGN_TOKENS_PATH`
#     resolves to a real file inside the stage regardless of (2) below.
#   - aletheia#7361: the 50 pre-existing undeclared-token findings in
#     `crates/theatron/proskenion/` are paid down, or `dokimasia` grows
#     a baseline/allowlist flag (`--help` has none today) so this stage
#     can gate on new debt only instead of redlining on old debt with no
#     ratchet path.
#
# Until then this would be a known-red stage with no path to green, so
# it stays out of the pipeline rather than carried as permanent debt.
