    "RUSTSEC-2026-0192",
    # quick-xml duplicate-attribute CPU DoS — direct aletheia/poiesis users upgraded to quick-xml 0.41; remaining transitive copies blocked by latest docx-rs 0.4.20→quick-xml 0.36, spreadsheet-ods 1.0.4/citationberg 0.7.0→0.38, calamine 0.35.0/plist 1.9.0→0.39
    "RUSTSEC-2026-0194",
    # quick-xml NsReader namespace allocation DoS — direct aletheia/poiesis users upgraded to quick-xml 0.41; remaining transitive copies blocked by latest docx-rs 0.4.20→quick-xml 0.36, spreadsheet-ods 1.0.4/citationberg 0.7.0→0.38, calamine 0.35.0/plist 1.9.0→0.39
    "RUSTSEC-2026-0195",
    # rkyv out-of-bounds read on archives containing Rc/Arc with mismatched pointer metadata — transitive only: rust_decimal 1.42.1 → spreadsheet-ods + typst-library, both document-generation deps of poiesis. Patched is rkyv >= 0.8.17, a major bump three levels up: rust_decimal's optional archive support must move to 0.8 first, then spreadsheet-ods and typst-library. Not reachable here — the flaw requires DESERIALIZING an untrusted rkyv archive, and no aletheia crate uses rkyv (zero matches under crates/); it is linked only because rust_decimal offers archive support to those two crates. Revisit when rust_decimal ships rkyv 0.8. Tracked in #6606
    "RUSTSEC-2026-0235",
    # memmap2 unsound (unchecked pointer offset) — transitive via candle-core (safetensors mmap) + grep-searcher, pinned ^0.9; unsound offset path not exercised. cargo-deny does not trigger; keeps sync with .cargo/audit.toml.
    # review-by: 2026-12-01
    "RUSTSEC-2026-0186",
    # crossbeam-epoch unmaintained — transitive dependency, no upgrade path
    "RUSTSEC-2026-0204",
    # fxhash unmaintained — transitive via selectors -> kuchikiki -> wry -> dioxus-desktop -> dioxus, proskenion's desktop UI toolkit; no safe upgrade (rustc-hash requires a kuchikiki-side migration we do not control)
    "RUSTSEC-2025-0057",
    # proc-macro-error unmaintained — transitive via glib-macros/gtk3-macros -> gtk -> ... -> dioxus-desktop -> dioxus, proskenion's GTK3/webkit2gtk desktop UI stack; no safe upgrade until the gtk-rs 0.18 chain migrates off it
    "RUSTSEC-2024-0370",
    # rustybuzz unmaintained (maintenance-status only, no vuln). Transitive GUI text-shaping via theatron (parley/vello, Dioxus-native+Blitz). No maintained successor; not a security surface. Matches the theatron ignore + existing precedent.
    "RUSTSEC-2026-0206",
    # glib::VariantStrIter unsound Iterator impl (fixed >=0.20.0) -- glib 0.18.5 is pinned by the whole gtk-rs 0.18 release train (gtk/gdk/gio/pango/cairo-rs/webkit2gtk/atk), which dioxus-desktop 0.7.10 (proskenion's desktop UI toolkit) depends on; bumping requires that entire third-party stack to release together, not something this crate's dependents control. proskenion's own source never uses VariantStrIter directly.
    "RUSTSEC-2024-0429",
    # rand::thread_rng() unsound only when the `log` feature is enabled AND a custom logger calls back into ThreadRng during a reseed (fixed >=0.8.6) -- transitive via selectors -> kuchikiki -> wry -> dioxus-desktop -> dioxus (phf_generator's compile-time perfect-hash-table codegen, itself only reachable as a build-time helper of `selectors`); no custom log integration touches this path, and phf_generator has no upgrade path off its `rand = "^0.7"` pin without a coordinated upstream release.
    "RUSTSEC-2026-0097",
]
