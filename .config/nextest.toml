# nextest configuration for aletheia
# See: https://nexte.st/book/configuration.html

[profile.default]
# Retry flaky tests up to 2 times with a fixed 1s delay before failing
retries = { backoff = "fixed", count = 2, delay = "1s" }
# Mark tests as slow after 60 seconds
slow-timeout = { period = "60s" }

# WHY (aletheia#5779 §8.4): the migration crash-injection matrix asserts a
# real process abort actually happened (SIGABRT) and that resuming after it
# converges. A retry would silently re-run past exactly the nondeterminism
# this harness exists to catch, turning a genuine data-loss regression into
# a transient-looking flake.
[[profile.default.overrides]]
filter = 'package(integration-tests) and test(=crash_at_every_step_resumes_to_identical_final_state)'
retries = 0

[[profile.default.overrides]]
filter = 'package(integration-tests) and test(=baseline_uninterrupted_migration_succeeds)'
retries = 0

[profile.ci]
# WHY no retries in the profile the REQUIRED gate runs: a retry makes the check non-deterministic in
# the PASS direction. A flaky test that fails once and passes on retry reports green, so the
# Gate-Passed trailer attests a result the same commit may not reproduce — and the flake is never
# seen, because the only signal it would produce was consumed by the retry.
#
# Flakes are defects to fix. `profile.default` keeps retries for local runs where a transient failure
# is noise rather than evidence, and per-test overrides remain available for a genuine external
# dependency.
retries = 0
# Terminate slow tests after a second slow-timeout expiry
slow-timeout = { period = "60s", terminate-after = 2 }

[[profile.ci.overrides]]
filter = 'package(integration-tests) and test(=crash_at_every_step_resumes_to_identical_final_state)'
retries = 0

[[profile.ci.overrides]]
filter = 'package(integration-tests) and test(=baseline_uninterrupted_migration_succeeds)'
retries = 0

[profile.ci.junit]
# JUnit XML report for CI integration
path = "target/nextest/ci/junit.xml"
