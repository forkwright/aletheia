name: Docs Lint

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  retired-backup-docs:
    name: retired backup references
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # WHY(#6523): ubuntu-latest carries no ripgrep, and the check consumed rg
      # through a process substitution whose failure it discarded — so it
      # reported clean on every PR without scanning anything.
      - name: Install ripgrep
        uses: ./.github/actions/apt-install
        with:
          packages: ripgrep
          verify: command -v rg >/dev/null
      - name: Check retired backup references
        run: scripts/check-docs-retired-backup.sh
      - name: Check public doc contracts
        run: python3 scripts/check-public-doc-contracts.py
