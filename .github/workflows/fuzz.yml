# WHY: Weekly fuzz runs catch parsing/deserialization crashes that unit
# tests miss. Targets exercise user-controlled JSON surfaces, config
# parsing, and knowledge store round-trips.
name: Fuzz

on:
  schedule:
    # NOTE: Saturday 04:00 CST (10:00 UTC), avoids overlap with CodeQL (Wednesday)
    - cron: "0 10 * * 6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        target:
          - fuzz_config_parsing
          - fuzz_tool_dispatch
          - fuzz_knowledge_roundtrip
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      # WHY dated, not floating `nightly`: nightly feature availability can
      # shift by date, so an undated pin makes a scheduled fuzz run
      # unreproducible (#4945). Bump deliberately, reviewed like any other
      # tool pin in this file.
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # nightly
        with:
          toolchain: nightly-2026-08-15

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: fuzz

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked --version 0.13.2

      - name: Run ${{ matrix.target }}
        working-directory: fuzz
        run: cargo +nightly fuzz run ${{ matrix.target }} -- -max_total_time=300

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-crashes-${{ matrix.target }}
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore
