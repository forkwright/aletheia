# WHY: Block merges on known vulnerabilities and license/source/ban
# violations. Runs `cargo audit` (RustSec DB), `cargo deny check`
# (licenses, sources, bans, advisories), and OSV-Scanner on every PR and
# daily against main so newly-published CVEs against existing deps are caught
# even when no PR is open. See standards/CI.md § Vulnerability scanning.
#
# WHY(#6609): gitleaks + trufflehog scan committed CONTENT for secrets (full
# git history, fetch-depth: 0) — a different threat model than cargo-deny/
# cargo-audit/osv-scanner, which scan dependency metadata for known CVEs.
# A secret committed once and later removed stays visible in `git log -p`
# forever; only a history-scanning job catches that. Modeled on kanon's
# shared workflow/templates/ci/security.yml. gitleaks reads the fully-authored
# .gitleaks.toml already at repo root (custom rules + allowlist) rather than
# gitleaks' bundled default ruleset.
name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # NOTE: Daily at 05:00 CST (11:00 UTC), avoids overlap with CodeQL
    # (Wednesday 08:00 CST) and Fuzz (Saturday 04:00 CST).
    - cron: "0 11 * * *"
  workflow_dispatch:

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    # WHY: checks licenses, banned crates (openssl-sys), source registries,
    # and the RustSec advisory DB using deny.toml's ignore list. Any
    # finding fails the job — suppressions require a deny.toml entry with
    # a WHY comment, not silent --ignore flags.
    name: cargo deny
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # PROJECT: security hardening — never expose token to steps
      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # WHY: run every check explicitly so a schema regression in one
          # section can't silently disable the others. cargo-deny expects
          # the check subcommand followed by space-separated check names;
          # `arguments:` passes post-subcommand flags only.
          command: check advisories licenses bans sources
          arguments: --all-features
          # WARNING: do not reintroduce a `credentials:` input interpolating the fleet token.
          # Dependabot runs resolve it empty, which renders `https://forkwright:@github.com` -
          # a malformed credential that git prefers over an anonymous fetch and then fails on.
          # Fleet git deps are public; the shared fleet-git-credentials action above already
          # handles the authenticated case for any future private dep.
          use-git-cli: true

  cargo-audit:
    # WHY: cargo-deny's advisories check overlaps but uses a different code
    # path; running cargo-audit independently protects against bugs or
    # config drift disabling one of the two. See standards/CI.md.
    name: cargo audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: cargo-audit
      - name: Install cargo-audit
        # WHY SHA-pinned: this downloads a binary from the network inside the REQUIRED
        # `cargo audit` job, and a mutable tag can be repointed. Every other action in this
        # repo is SHA-pinned; this was the sole exception.
        uses: taiki-e/install-action@6a1bd70eaac3c8bdf093356838d7ee09fda951cf # v2.85.5
        with:
          tool: cargo-audit
      - name: cargo audit
        # WHY: -D unmaintained,unsound,yanked escalates those categories
        # to errors (default is warning only). Suppressions go through
        # .cargo/audit.toml, which mirrors deny.toml's [[advisories.ignore]]
        # entries — no silent --ignore flags here.
        run: cargo audit --deny unmaintained --deny unsound --deny yanked

  osv-scanner:
    name: osv scanner
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      scan-args: '--config=osv-scanner.toml --lockfile=Cargo.lock'

  secret-scan:
    name: trufflehog secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # WHY(exclude Lob): the Lob detector matches
      # `\b((live|test)_[a-zA-Z0-9_]{35})\b` -- a character class that
      # INCLUDES underscore -- so any `test_`-prefixed identifier whose
      # remainder is exactly 35 word characters is a full match. This repo's
      # descriptive test names hit that length routinely.
      #
      # WHY it still reports "verified": the detector's verification POSTs the
      # candidate as a Basic-auth username to Lob's us_verifications endpoint
      # and treats 403/422 as active. That endpoint returns 422 for essentially
      # any malformed request, so verification does no discrimination here --
      # `--only-verified` does not filter this class out.
      #
      # Excluding one detector this repo has no use for beats renaming a test
      # to dodge a length coincidence, which only defers the next one.
      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@6c05c4a00b91aa542267d8e32a8254774799d68d # v3.93.8
        with:
          extra_args: --only-verified --exclude-detectors=Lob

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
