# WHY(#6730): GitHub honours a closing keyword only for the FIRST issue in a
# comma-separated list. A body reading `Closes #A, #B, #C` closes #A and links
# #B and #C as plain mentions, so their work merges while they stay open.
#
# The failure is invisible at every point someone would catch it: the rendered
# body shows all three as issue links, nothing warns at merge, and it only
# surfaces when a triage pass finds an open issue whose fix is already in main
# -- where it reads as a lost fix rather than a lost link. Measured on this
# repo: 13 merged PRs used the form and stranded 21 issues across two sweeps.
#
# WHY a script rather than an inline grep: the rule has to tolerate a body that
# DOCUMENTS it, which means ignoring code spans, and that is worth unit tests
# (scripts/test-pr-closes-keyword.py) rather than a regex buried in YAML.
name: PR Closes Keyword

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  closes-keyword:
    name: one keyword per issue
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - name: Self-test the checker
        run: scripts/test-pr-closes-keyword.py

      - name: Check PR body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: scripts/check-pr-closes-keyword.py
