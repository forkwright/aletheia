# WHY: proskenion is workspace-excluded; this job compiles, lints, and tests it when desktop paths change.
name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/theatron/proskenion/**"
      - "crates/theatron/skene/**"
      # WHY: koina is a path dependency of both proskenion and skene, but is a
      # root-workspace member. Root CI compiles koina without ever building
      # proskenion (workspace-excluded), so a breaking koina API change is
      # invisible until the tag-triggered release job compiles the desktop app.
      - "crates/koina/**"
      - "scripts/*proskenion*"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "crates/theatron/proskenion/**"
      - "crates/theatron/skene/**"
      - "crates/koina/**"
      - "scripts/*proskenion*"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proskenion:
    name: proskenion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Install GTK/WebKit system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: proskenion-${{ hashFiles('crates/theatron/proskenion/Cargo.toml') }}
          workspaces: "crates/theatron/proskenion"

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@6c6fd71fe4fb72c3697d269963d0e15df8adedad # v2
        with:
          tool: nextest

      - name: Check desktop CI path filter covers proskenion path deps
        run: scripts/check-desktop-ci-paths.py

      - name: Check proskenion theatron pins
        run: scripts/check-proskenion-pins.py

      - name: Check proskenion flake wiring
        run: scripts/check-proskenion-flake.py

      # WHY: the pin check compares the versions the lockfile records, which
      # cannot see a dependency-set change. Editing a root-workspace manifest
      # rewrites what proskenion's lockfile must record, and every cargo step
      # below resolves without --locked, so a stale lock is silently updated
      # here and fails only in the tag-triggered release build.
      - name: Check proskenion lockfile resolves
        run: cargo metadata --manifest-path crates/theatron/proskenion/Cargo.toml --format-version 1 --locked > /dev/null

      - name: cargo fmt --check
        run: cargo fmt --manifest-path crates/theatron/proskenion/Cargo.toml --all -- --check

      - name: cargo clippy
        run: cargo clippy --manifest-path crates/theatron/proskenion/Cargo.toml --all-targets -- -D warnings

      - name: cargo nextest run
        run: cargo nextest run --profile ci --manifest-path crates/theatron/proskenion/Cargo.toml --no-tests=pass

      - name: Upload nextest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-proskenion
          path: |
            target/nextest/ci/junit.xml
            crates/theatron/proskenion/target/nextest/ci/junit.xml
            target/nextest/**/*.log
            crates/theatron/proskenion/target/nextest/**/*.log
          if-no-files-found: warn
