# WHY: proskenion is a full but non-default root-workspace member (default-members
# excludes it so a bare `cargo build`/`cargo check` stays GTK-free; see Cargo.toml
# and docs/DESKTOP.md). This job compiles, lints, and tests it -- scoped with `-p
# proskenion` against the ONE root Cargo.lock -- as a fast, path-filtered gate so a
# desktop-only change doesn't wait on the full-workspace gate-attestation run.
name: Desktop

on:
  pull_request:
    branches: [main]
    paths:
      - "crates/theatron/proskenion/**"
      - "crates/theatron/skene/**"
      # WHY: koina is a path dependency of both proskenion and skene, but is a
      # default-member of the root workspace. Root CI's default (non--workspace)
      # commands compile koina without ever building proskenion, so a breaking
      # koina API change is invisible until a `-p proskenion`/`--workspace` build
      # runs -- this job, or the tag-triggered release job.
      - "crates/koina/**"
      - "scripts/*proskenion*"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "crates/theatron/proskenion/**"
      - "crates/theatron/skene/**"
      - "crates/koina/**"
      - "scripts/*proskenion*"
      - ".github/workflows/desktop.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  proskenion:
    name: proskenion
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # WHY: toolchain falls through to rust-toolchain.toml, the SSOT for the
      # pinned Rust version (#4945) — no `toolchain:` override here.
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          components: rustfmt, clippy

      - name: Install GTK/WebKit system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev librsvg2-dev

      # WHY workspaces: "." (aletheia#4726): proskenion's own Cargo.lock is gone
      # -- it resolves against the ONE root Cargo.lock now, same as every other
      # workspace member.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: proskenion-${{ hashFiles('crates/theatron/proskenion/Cargo.toml') }}
          workspaces: "."

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@742a3317eac7bd62f91cd888b4eead5e784ba833 # v2
        with:
          tool: nextest@0.9.143

      - name: Check desktop CI path filter covers proskenion path deps
        run: scripts/check-desktop-ci-paths.py

      - name: Check proskenion flake wiring
        run: scripts/check-proskenion-flake.py

      # WHY --locked, folded into the plain check rather than a separate
      # `cargo metadata --locked` step (aletheia#4726 removed the standalone
      # proskenion workspace/lockfile this used to guard): a root-manifest
      # edit that changes proskenion's resolved dependency set now shows up
      # as a Cargo.lock diff review can see, and --locked here fails loudly
      # the moment this job's build would otherwise silently rewrite it.
      - name: cargo check
        run: cargo check -p proskenion --all-targets --locked

      - name: cargo fmt --check
        run: cargo fmt -p proskenion -- --check

      - name: cargo clippy
        run: cargo clippy -p proskenion --all-targets -- -D warnings

      - name: cargo nextest run
        run: cargo nextest run --profile ci -p proskenion --no-tests=pass

      - name: Upload nextest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-proskenion
          path: |
            target/nextest/ci/junit.xml
            target/nextest/**/*.log
          if-no-files-found: warn
