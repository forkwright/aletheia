# WHY(#6806): release-please creates its PR with GITHUB_TOKEN, and GitHub raises no
# workflow-triggering events for that token. Every release PR therefore arrives with its
# required contexts ABSENT rather than red, and branch protection holds a PR with a
# missing context forever -- nothing to re-run, nothing to approve. Measured across two
# repos in one day: five release PRs, all of them, none recoverable without a human
# noticing and closing/reopening by hand.
#
# A missing check is worse than a failing one. A red check advertises itself; an absent
# one looks exactly like a PR that has not finished. Releases stopped, and the only
# symptom was a PR that appeared to be waiting on CI.
#
# The operation is APPROVING the runs GitHub already created for the PR, not dispatching
# new ones. An earlier version of this file dispatched, on the reasoning that a run at
# the branch head puts check runs on the PR's head SHA "which is what branch protection
# reads". That last step is false, and it was measured: branch protection reads the PR's
# `statusCheckRollup`, a dispatched run's check runs attach to the COMMIT, and the two
# are not the same list. #6902 sat at `mergeStateStatus: BLOCKED` with `gate`,
# `cargo audit` and `cargo deny` all SUCCEEDING on its head commit and a rollup of two
# entries. Approving its 25 held runs took the rollup from 0 to 32 at once.
#
# Dispatch survives only for a workflow with NO run at all, where there is nothing to
# approve -- it gets the run created and the next tick approves it.
#
# WHY a schedule and not a hook on every push to main: release-please force-pushes the
# release branch on every main push, so a per-push dispatch would restart the ~90-minute
# gate each time and, during a busy period, never reach a verdict while occupying a
# runner continuously. An hourly sweep coalesces -- each tick sees only the current head.
# Gate Attestation's concurrency group is ref-keyed for non-push events, so successive
# dispatches at the same branch cancel each other and at most one release-branch gate is
# ever in flight.
name: Release PR checks

on:
  # WHY(#6806) workflow_run and not a schedule alone: release-please FORCE-PUSHES the
  # release branch on every push to main, and each new head arrives with its runs held
  # again. Measured while merging a queue of PRs -- the branch regenerated and went
  # straight back to one visible check within minutes of being healed. An hourly sweep
  # cannot win that race: by the time it ticks, the head it examined no longer exists.
  #
  # This fires when Release Please itself finishes, so the healer runs against the head
  # that was just created, once per regeneration. `workflow_run` executes in the default
  # branch's context with repository permissions and is NOT subject to the approval gate
  # that holds the release PR's own runs -- which is what makes it usable here.
  workflow_run:
    workflows: ["Release Please"]
    types: [completed]
  # Kept as a backstop, not the primary path: it is the only trigger that still fires if
  # Release Please itself fails, is disabled, or is renamed out from under the line above.
  schedule:
    # NOTE: hourly at :17, off the top of the hour where the daily security and
    # weekly CodeQL crons sit.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # WHY cancel-in-progress here, where the earlier version said false: with
  # workflow_run, two regenerations in quick succession would otherwise queue two
  # sweeps, and the older one would act on a head that no longer exists. The newest
  # sweep is always the correct one.
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  heal:
    name: a release PR has its required checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # actions: write to dispatch the gating workflows; pull-requests: read to find
      # the open release PR and its head SHA. Nothing here writes to a PR.
      actions: write
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # WHY(filter): this job runs one Python script that only talks to the API.
          filter: blob:none
          persist-credentials: false

      - name: Self-test the healer
        run: python3 -m unittest discover -s scripts/tests -p 'test_release_pr_checks.py'

      - name: Approve the release PR's held runs
        env:
          # WHY the PAT first: approving a workflow run needs `actions: write` on a token
          # GitHub accepts for that endpoint, and GITHUB_TOKEN is documented to be
          # refused for run approval. The fallback keeps the job runnable in a fork or a
          # checkout without the secret -- and the script now REPORTS an empty rollup as
          # a failure rather than declaring success, so a token that cannot approve
          # surfaces as a red job naming the cause instead of a silent no-op.
          GH_TOKEN: ${{ secrets.FLEET_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 scripts/release_pr_checks.py
