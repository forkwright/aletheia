# WHY(#5793): The full-stack server smoke test is marked #[ignore] because it
# needs the aletheia binary and a real TCP port. This job builds the binary
# and runs the ignored test so the live bind + HTTP path is exercised in CI.
name: Integration Server Smoke Test

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # WHY: full debuginfo bloats the dev-profile target dir; line tables keep
  # backtraces usable while staying within hosted-runner disk limits.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  integration-server-smoke:
    name: full-stack server smoke test
    runs-on: ubuntu-latest
    # WHY(#6416): cold build alone runs ~17-18min; 20min left no margin for
    # the test binary compile + the smoke test itself, so every run was
    # cancelled before reaching the test.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "free disk after reclaim:"
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: integration-server-smoke
          # WHY(#6416): a run that times out before `cargo test` finishes
          # still completed a real `cargo build`; persist that cache instead
          # of discarding it and starting cold again next run.
          cache-on-failure: true

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Build aletheia binary
        run: cargo build -p aletheia --features test-support

      - name: Run ignored full-stack smoke test
        run: cargo test -p aletheia --test integration_server --features test-support -- --include-ignored
