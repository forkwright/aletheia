# WHY both guards live here: they share one premise -- this repository squash-merges,
# so a PR title becomes the commit subject, and that subject is the only thing
# release-please reads. What leaks through it reaches the public CHANGELOG, and what it
# cannot parse never reaches the CHANGELOG at all. Splitting them would put that premise
# in two files, where one copy would eventually stop matching the other.
name: PR Title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title-guard:
    name: fleet hostname guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check PR title for fleet hostnames
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # WHY: fleet hostnames (menos/metis/verda/nomos) reach the public CHANGELOG
          # via release-please, which generates entries from merged PR titles.
          # Catching them here prevents hostname leakage before merge.
          PATTERN='\b(menos|metis|verda|nomos)\b'
          if echo "${PR_TITLE}" | grep -qiE "${PATTERN}"; then
            echo "pr-title-pii: PR title contains a private fleet hostname." >&2
            echo "  Title: ${PR_TITLE}" >&2
            echo "  Matched pattern: ${PATTERN}" >&2
            echo "  Use a neutral description that does not reference internal machine names." >&2
            exit 1
          fi
          echo "pr-title-pii: clean"

  conventional-title:
    # WHY(#6806) a check and not a convention: a title release-please cannot parse
    # fails nothing at merge. The squash succeeds, the work simply never appears in
    # the changelog and never moves the version, and that is only visible to someone
    # comparing a release against the PRs it contains. Measured over the last 100
    # merged PRs here: 11 titles unparseable, including four dense batches whose
    # entire contents were invisible to the release that shipped them.
    name: the title reaches the changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          filter: blob:none
          persist-credentials: false

      - name: Self-test the checker
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_pr_title_conventional.py'

      - name: Check PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/check-pr-title-conventional.py
