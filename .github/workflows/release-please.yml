name: Release Please

on:
  push:
    branches: [main]

permissions: {}

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHY(#6443): release creation and artifact dispatch share one control lane.
    # Queue later main pushes rather than cancelling after the action has made a
    # tag/draft but before this job has emitted the one exact-tag dispatch.
    concurrency:
      group: release-please-control-${{ github.ref }}
      queue: max
      cancel-in-progress: false
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      # WHY a checkout in a job whose only action talks to the API: the assert
      # step below runs `git fetch` and reads `release-please-config.json` from
      # disk, and neither exists in a bare runner workspace. Without this the
      # step dies at `fatal: not a git repository` on its first command --
      # before it can evaluate anything -- so the guard never actually ran and
      # instead reported a permanent red on main whenever a release PR was cut.
      # A guard that cannot reach its own assertion is worse than none: it hides
      # a real release failure behind a failure of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # WHY(#6443): workflow_dispatch is the one GITHUB_TOKEN-created event
      # GitHub intentionally allows to start another workflow. Dispatch at the
      # new tag ref so release.yml's github.sha is the release commit even when
      # a later main push happened to run Release Please first.
      - name: Dispatch artifacts for the exact released tag
        if: steps.release.outputs.release_created == 'true'
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.release.outputs.tag_name }}
          RELEASE_SHA: ${{ steps.release.outputs.sha }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ || ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::release-please emitted invalid release identity ${RELEASE_TAG}@${RELEASE_SHA}"
            exit 1
          fi
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          direct="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          peeled="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          live_tag_commit="${peeled:-$direct}"
          if [[ "$live_tag_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::live ${RELEASE_TAG}=${live_tag_commit:-missing}, expected=${RELEASE_SHA}"
            exit 1
          fi
          gh workflow run release.yml \
            --ref "$RELEASE_TAG" \
            --field tag_name="$RELEASE_TAG" \
            --field release_sha="$RELEASE_SHA"

      # WHY(#6713): release-please does not fail, or even exit non-zero, when an
      # `extra-files` jsonpath matches nothing. It logs "No entries modified" and
      # reports success, so a release PR that silently left a declared file
      # unbumped looks identical to a correct one. The divergence surfaces
      # downstream at check-proskenion-pins, which reads as a broken branch rather
      # than a broken release tool, and blocks the release.
      #
      # The trap that produced this guard, since it will recur with any new
      # entry: release-please parses TOML with a tagger that wraps every scalar
      # leaf as `{start, end, value}` so it can splice byte ranges later. A
      # predicate comparing a leaf directly (`?(@.name == 'koina')`) therefore
      # compares an object to a string and is always false, while an existence
      # predicate (`?(!@.source)`) is indifferent to the wrapper and works. The
      # comparison form must dereference `.value`; the terminal segment must not,
      # because the splice needs the tagged object. Upstream: release-please#2455.
      #
      # WARNING: this step deliberately only DETECTS. It must never push a fix. A
      # lockfile amend from CI authenticates with GITHUB_TOKEN, which raises no
      # workflow-triggering events, so every required check goes missing rather
      # than red and the PR is permanently BLOCKED -- see the warning below and
      # releases 0.33.1 / 0.33.3.
      - name: Assert every declared extra-file actually moved
        if: steps.release.outputs.prs_created == 'true'
        # WARNING: pass the raw output and destructure it in the script, never
        # `fromJson(...)` in `env:`. A step's env expressions are evaluated when
        # the template is prepared, which happens even when `if:` skips the step
        # -- so once release-please starts UPDATING an existing PR instead of
        # creating one, `prs_created` is false, `.pr` is the empty string, and
        # `fromJson('')` throws as "The template is not valid". That failed every
        # run for four consecutive merges while the guard above was doing its job.
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="$(printf '%s' "${RELEASE_PR_JSON}" | jq -r '.headBranchName')"
          if [ -z "${HEAD_BRANCH}" ] || [ "${HEAD_BRANCH}" = "null" ]; then
            echo "::error::release-please reported prs_created=true but its pr output carries no headBranchName"
            exit 1
          fi
          # WHY the explicit refspec: actions/checkout narrows
          # `remote.origin.fetch` to the ref it checked out, so a bare
          # `git fetch origin <branch>` for any OTHER branch lands in FETCH_HEAD
          # and never creates `refs/remotes/origin/<branch>`. The rev-parse below
          # would then fail on an unknown revision -- the same dead guard one
          # line later.
          git fetch --no-tags --depth=2 origin \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}"
          head="$(git rev-parse "origin/${HEAD_BRANCH}")"
          # WHY the commit's OWN diff, not a diff against main: the release branch
          # lags main between cuts, so comparing the two attributes every commit
          # that landed meanwhile to the release. Tested against the live stuck PR
          # -- the main-relative form reported success because an unrelated merge
          # had touched the very file that was NOT bumped, which is the precise
          # false negative this guard exists to prevent.
          changed="$(git diff --name-only "${head}^..${head}")"

          # Cargo.toml is the version SSOT. If it did not move this is not a
          # version bump, and there is nothing to assert about files tracking it.
          if ! grep -qx 'Cargo.toml' <<<"$changed"; then
            echo "Cargo.toml unchanged; not a version bump. Nothing to assert."
            exit 0
          fi

          missing=0
          while IFS= read -r path; do
            [ -n "$path" ] || continue
            if ! grep -qxF "$path" <<<"$changed"; then
              echo "::error::release-please declares an extra-file at '${path}' but the release PR did not change it, while Cargo.toml moved. Its jsonpath matched nothing and the tool reported success anyway (aletheia#6713)."
              missing=1
            fi
          done < <(jq -r '.packages["."]["extra-files"][]?.path // empty' release-please-config.json | sort -u)

          if [ "$missing" -eq 1 ]; then
            echo "::error::Release PR is incomplete. Do NOT patch the branch by hand -- release-please force-pushes and discards it."
            exit 1
          fi
          echo "All declared extra-files moved with the version."

      # WHY(#7107): the commit-message parser release-please's changelog writer runs
      # on top of aborts silently on a malformed body -- one it cannot finish parsing
      # -- and the action still reports success. 0.44.0 (#7007) shipped without its
      # most operationally significant fix, `fix(agora)` #7105, because that commit's
      # ` ```rust ` body fence held an unclosed `(`; the only trace was a debug line
      # in the run log ("commit could not be parsed"), never surfaced on the PR, the
      # run conclusion, or the changelog itself. The same run dropped a second,
      # unrelated commit (#7062) the same way. Neither failure turned anything red.
      #
      # This is the identical shape as the extra-files guard above: release-please
      # can silently drop something it was supposed to carry forward, so detect the
      # drop from outside rather than trust the tool's own success signal.
      #
      # WARNING: this step deliberately only DETECTS, for the same reason as above --
      # amending the release branch from CI would authenticate with GITHUB_TOKEN and
      # every required check would go missing rather than red.
      - name: Assert the changelog names every visible commit in the release range
        if: steps.release.outputs.prs_created == 'true'
        env:
          RELEASE_PR_JSON: ${{ steps.release.outputs.pr }}
        run: |
          set -euo pipefail
          HEAD_BRANCH="$(printf '%s' "${RELEASE_PR_JSON}" | jq -r '.headBranchName')"
          if [ -z "${HEAD_BRANCH}" ] || [ "${HEAD_BRANCH}" = "null" ]; then
            echo "::error::release-please reported prs_created=true but its pr output carries no headBranchName"
            exit 1
          fi

          # The manifest on disk right now is the PRE-bump version: release-please
          # talks to the API to build the PR branch, it never touches this checkout,
          # so this file still names the release the current range starts after.
          PREV_VERSION="$(jq -r '.["."]' .release-please-manifest.json)"
          FROM_REF="v${PREV_VERSION}"

          # First-ever release: nothing has shipped yet, so there is no prior tag to
          # diff a range against and nothing could have been dropped from one.
          if [ -z "$(git ls-remote --tags origin "refs/tags/${FROM_REF}")" ]; then
            echo "No ${FROM_REF} tag on origin; nothing to diff against. Skipping."
            exit 0
          fi

          # WHY --shallow-exclude and not a fixed --depth: the release range's
          # commit count varies release to release, and a fixed depth is either
          # wasteful most of the time or silently too shallow on a big one. This
          # fetches exactly the history between the prior tag and the release
          # branch head, no more.
          git fetch --no-tags --shallow-exclude="${FROM_REF}" origin \
            "+refs/heads/${HEAD_BRANCH}:refs/remotes/origin/${HEAD_BRANCH}" \
            "+refs/tags/${FROM_REF}:refs/tags/${FROM_REF}"
          head="$(git rev-parse "origin/${HEAD_BRANCH}")"

          python3 scripts/check-changelog-completeness.py \
            --from-ref "${FROM_REF}" --to-ref "${head}"

  # WHY(#6513): Cargo.lock's per-member version fields (#6418) are patched by
  # release-please itself, via the `$.package[?(!@.source)].version` extra-file
  # added in #6516 — the same entry the rest of the fleet uses. A second job
  # regenerating the lockfile and pushing the result is a duplicate owner of
  # that capability, and the duplicate is the one that breaks releases: its
  # push authenticates with GITHUB_TOKEN, and GitHub raises no workflow-
  # triggering events for pushes made with that token. Every required check
  # then goes missing rather than red, leaving the release PR permanently
  # BLOCKED with nothing to re-run and nothing to approve.
  #
  # WARNING: do not reintroduce a lockfile-amend step here. If Cargo.lock ever
  # needs a fix release-please cannot express, it belongs in the extra-files
  # list, not in a push from CI. Release 0.33.1 (#6509) carried the amend
  # commit as its head and got zero workflow runs; 0.33.3 (#6518), the first
  # release after #6516, has release-please's own commit as its head, a
  # Cargo.lock already at 0.33.3, and a full set of runs.
