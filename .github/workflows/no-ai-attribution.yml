# WHY (#4278): generated-output attribution markers can leak through commit
# messages and PR metadata. PR bodies are a separate surface — GitHub squashes
# the PR body into the merge commit, so a marker in the PR body can become part
# of main's git history even with clean commits.
#
# The forbidden pattern is checked in at .github/no-ai-attribution-patterns.txt
# and consumed directly by both scan surfaces below.
name: No AI Attribution

on:
  pull_request:
    branches: [main]
    # WHY(#6874) `edited`: the PR BODY is squashed into the merge commit, and without
    # this the check never re-runs after a body edit. A marker added by editing the
    # description after the last push was scanned by nothing at all -- the same hole
    # the title guard already closes by listing these four types.
    types: [opened, edited, synchronize, reopened]

# WHY(#6874) no `pull-requests: read`: the title and body are read from the event
# payload rather than the API, so this workflow needs no token scope for them at all.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  no-ai-attribution:
    name: no-ai-attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # WHY: bypass keys off the PR author login, not github.actor. The actor
      # changes to a maintainer login whenever someone re-runs the workflow
      # (e.g. clicking "Re-run failed jobs" on an automation PR), which silently
      # re-arms the attribution scan on bot PRs. The PR author is the stable
      # identity worth waiving — same class of bug as gate-attestation #4084.
      - name: Pass trusted automation PRs
        if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' || github.event.pull_request.user.login == 'release-please[bot]' || github.event.pull_request.user.login == 'github-actions[bot]' }}
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: echo "Attribution check waived for trusted automation PR author ${PR_AUTHOR}."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'release-please[bot]' && github.event.pull_request.user.login != 'github-actions[bot]' }}
        with:
          fetch-depth: 0
          # WHY(filter): reads commit messages via `git log --format`, never file
          # contents, so the commit graph is the whole requirement.
          filter: blob:none
          persist-credentials: false

      - name: Self-test the scanner
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'release-please[bot]' && github.event.pull_request.user.login != 'github-actions[bot]' }}
        run: python3 -m unittest discover -s scripts/tests -p 'test_check_attribution_markers.py'

      # WHY(#6874) one step over title, body and commits: the shell version fetched
      # title and body through `gh` (GraphQL) and exited 1 whether it found a marker or
      # could not reach GitHub. A GraphQL degradation reddened every open PR with a 503
      # and no scan output, and maintainers went hunting a marker that did not exist --
      # three times in one day, across four PRs, while the commit-scanning gate passed
      # on the same commits. The two disagreed purely on transport availability.
      #
      # The subject now comes from GITHUB_EVENT_PATH, which is on disk before the job
      # starts, so there is no fetch to fail. An unreadable subject exits 2 and a marker
      # exits 1, with different messages: both non-zero, because a check that cannot
      # read its subject must never report clean, but the red now says which happened.
      - name: Scan PR title, body and commits for attribution markers
        if: ${{ github.event.pull_request.user.login != 'dependabot[bot]' && github.event.pull_request.user.login != 'release-please[bot]' && github.event.pull_request.user.login != 'github-actions[bot]' }}
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check-attribution-markers.py --commits
