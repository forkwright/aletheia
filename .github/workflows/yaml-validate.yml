# WHY: malformed YAML in .github/ (e.g. a broken pre-commit config that silently
# failed yamllint) was discoverable only at runtime. Catch invalid YAML at PR
# time so broken verification configs never land. See #4929.
name: YAML Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml-validate:
    name: validate YAML configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow and config YAML files
        run: |
          python3 - <<'EOF'
          import sys, yaml, glob, pathlib

          patterns = [
              ".github/workflows/*.yml",
              ".github/dependabot.yml",
          ]
          files = []
          for pattern in patterns:
              files.extend(glob.glob(pattern))

          errors = []
          for f in sorted(files):
              try:
                  yaml.safe_load(pathlib.Path(f).read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)

          print(f"All {len(files)} YAML file(s) valid")
          EOF

      # WHY(#6755) here rather than in the Rust gate: this counts a token in source
      # text and compiles nothing, so it belongs with the other cheap structural
      # checks and fails in seconds on the PR that added the suppression.
      #
      # It is a RATCHET, not a budget. `primitive-for-domain-id` is suppressed 200
      # times, and the count is the finding: #6755 was filed against 188, so the
      # population grew by twelve while the issue describing it sat open. A
      # suppression is a claim the lint is wrong here, nothing re-tests that claim,
      # and #4638 is what a stale one costs -- an unvalidated agent id reached actor
      # spawn for a full release cycle because its exemption said "not a runtime
      # domain identifier" and that had stopped being true.
      - name: Domain-id suppressions may only decrease
        run: python3 scripts/check-domain-id-suppressions.py

      # WHY(schemars): a `///` on a JsonSchema type is projected verbatim into the
      # generated schema's `description`, so it is published API -- read by an MCP
      # client, a generated SDK, a docs page. STANDARDS.md separately REQUIRES
      # comments to carry structured tags, so a maintainer writing `/// WHY: ...` on
      # a schema field follows one rule and leaks by the other, with nothing at the
      # point of writing revealing the conflict. 28 such types here and zero tags
      # today: a baseline of zero is the cheapest moment to pin it.
      - name: No maintainer notes in published schema descriptions
        run: python3 scripts/check-schema-descriptions.py

      - name: Validate automation PR gate policy
        run: |
          python3 scripts/check-automation-pr-gates.py
          python3 scripts/check-release-artifact-routing.py

      # WHY report-only: fetch-depth:0 + a short timeout + no filter is a risk
      # SIGNATURE, not a defect -- gate-coverage-scripts carries it
      # deliberately (#6757). This surfaces the pattern early instead of
      # waiting for the next job to time out and read as a false gate
      # failure, without gating on a judgment call this script cannot make.
      - name: Report checkout filter risk (fetch-depth:0 + short timeout)
        run: |
          python3 scripts/check-checkout-filter-risk.py >> "$GITHUB_STEP_SUMMARY"
