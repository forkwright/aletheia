# WHY: malformed YAML in .github/ (e.g. a broken pre-commit config that silently
# failed yamllint) was discoverable only at runtime. Catch invalid YAML at PR
# time so broken verification configs never land. See #4929.
name: YAML Validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  yaml-validate:
    name: validate YAML configs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflow and config YAML files
        run: |
          python3 - <<'EOF'
          import sys, yaml, glob, pathlib

          patterns = [
              ".github/workflows/*.yml",
              ".github/dependabot.yml",
          ]
          files = []
          for pattern in patterns:
              files.extend(glob.glob(pattern))

          errors = []
          for f in sorted(files):
              try:
                  yaml.safe_load(pathlib.Path(f).read_text())
              except yaml.YAMLError as e:
                  errors.append(f"{f}: {e}")

          if errors:
              for e in errors:
                  print(e, file=sys.stderr)
              sys.exit(1)

          print(f"All {len(files)} YAML file(s) valid")
          EOF

      - name: Validate automation PR gate policy
        run: python3 scripts/check-automation-pr-gates.py

      # WHY report-only: fetch-depth:0 + a short timeout + no filter is a risk
      # SIGNATURE, not a defect -- gate-coverage-scripts carries it
      # deliberately (#6757). This surfaces the pattern early instead of
      # waiting for the next job to time out and read as a false gate
      # failure, without gating on a judgment call this script cannot make.
      - name: Report checkout filter risk (fetch-depth:0 + short timeout)
        run: |
          python3 scripts/check-checkout-filter-risk.py >> "$GITHUB_STEP_SUMMARY"
