name: Release

# WHY every `token: ${{ secrets.FLEET_REPO_TOKEN }}` below is optional, not a
# hard requirement: Cargo.toml's only forkwright git dependency (theatron) is
# public and pinned to an immutable tag, so an unauthenticated fetch already
# resolves it (see `.github/actions/fleet-git-credentials/action.yml`, which
# explicitly treats an absent token as a supported case — public deps fetch
# anonymously). The token is kept as standing insurance against
# anonymous git-fetch rate-limit flakiness on GitHub-hosted runners, matching
# `gate-attestation.yml`'s `needs_fleet_repo_token` rationale. A contributor
# tagging a release from their own fork does not need this secret set for the
# build to succeed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag_name:
        description: Existing draft release tag to retry from its exact ref
        required: true
        type: string
      release_sha:
        description: Exact commit named by the existing tag
        required: true
        type: string

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GH_REPO: ${{ github.repository }}
  RELEASE_SHA: ${{ inputs.release_sha || github.sha }}
  RELEASE_TAG: ${{ inputs.tag_name || github.ref_name }}

jobs:
  release-identity:
    # WHY(#5427): reject a stale/mismatched tag before the canonical gate or
    # security workflows compile anything. The shared hybrid gate has no ref
    # input, so the exact-tag dispatch SHA must also equal github.sha.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Bind release inputs to the exact tag event
        env:
          CALLER_REF: ${{ github.ref }}
          CALLER_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ || "$RELEASE_SHA" != "$CALLER_SHA" ]]; then
            echo "::error::release SHA ${RELEASE_SHA} does not equal caller SHA ${CALLER_SHA}"
            exit 1
          fi
          if [[ "$CALLER_REF" != "refs/tags/${RELEASE_TAG}" ]]; then
            echo "::error::release must run at refs/tags/${RELEASE_TAG}, received ${CALLER_REF}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Verify tag, Cargo, manifest, and checkout identity
        run: |
          scripts/check-release-versioning.py verify-release --tag "$RELEASE_TAG"
          tag_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          checked_out="$(git rev-parse HEAD)"
          if [[ "$tag_commit" != "$RELEASE_SHA" || "$checked_out" != "$RELEASE_SHA" ]]; then
            echo "::error::${RELEASE_TAG}=${tag_commit}, checkout=${checked_out}, expected=${RELEASE_SHA}"
            exit 1
          fi

  canonical-gate:
    # WHY(#5422): one gate owner. A release runs the same hybrid gate,
    # repo-specific coverage, and aggregate verdict as a PR, with the
    # docs-only exemption disabled for the version-only release commit.
    needs: [release-identity]
    uses: ./.github/workflows/gate-attestation.yml
    permissions:
      contents: read
    with:
      release_mode: true
    secrets: inherit

  canonical-security:
    # WHY(#5422): release readiness includes the same dependency and secret
    # scans whose cargo audit/cargo deny contexts protect main.
    needs: [release-identity]
    uses: ./.github/workflows/security.yml
    with:
      release_sha: ${{ inputs.release_sha || github.sha }}
    permissions:
      actions: read
      contents: read
      security-events: write
    secrets: inherit

  prepare-release:
    needs: [canonical-gate, canonical-security]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Release Please creates this draft before the tagged dispatch. A direct
      # operator tag has no release object, so create the same draft shape.
      # Published releases are immutable input here: never upload into one.
      - name: Require a draft release object
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected_prerelease=false
          if [[ "$RELEASE_TAG" == *-* ]]; then
            expected_prerelease=true
          fi
          if release_json="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName 2>/dev/null)"; then
            if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
              echo "::error::${RELEASE_TAG} is already public; refusing to mutate it"
              exit 1
            fi
          else
            prerelease_args=()
            if [[ "$expected_prerelease" == "true" ]]; then
              prerelease_args+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --title "$RELEASE_TAG" --generate-notes "${prerelease_args[@]}"
          fi
          gh release edit "$RELEASE_TAG" --prerelease="$expected_prerelease"
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,isPrerelease,tagName)"
          test "$(jq -r '.isDraft' <<<"$release_json")" = "true"
          test "$(jq -r '.isPrerelease' <<<"$release_json")" = "$expected_prerelease"

  test:
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Check desktop CI path filter covers proskenion path deps
        run: scripts/check-desktop-ci-paths.py
      - name: Check proskenion theatron pins
        run: scripts/check-proskenion-pins.py
      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test
        run: cargo test --workspace --exclude proskenion

  feature-policy:
    # WHY: release feature coverage is derived from Cargo metadata so new
    # optional surfaces are checked unless they are explicitly excluded in the
    # policy manifest.
    needs: [prepare-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      feature_matrix: ${{ steps.matrices.outputs.feature_matrix }}
      no_default_matrix: ${{ steps.matrices.outputs.no_default_matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - name: Load Cargo metadata
        run: cargo metadata --format-version 1 --no-deps > metadata.json
      - name: Validate release feature policy
        run: scripts/release-feature-policy.py --metadata metadata.json validate
      - name: Derive release feature matrices
        id: matrices
        run: |
          echo "feature_matrix=$(scripts/release-feature-policy.py --metadata metadata.json matrix --kind feature-checks)" >> "$GITHUB_OUTPUT"
          echo "no_default_matrix=$(scripts/release-feature-policy.py --metadata metadata.json matrix --kind no-default-recipes)" >> "$GITHUB_OUTPUT"

  feature-check:
    # WHY: ensures optional features compile; if they break, nobody knows until someone
    # enables them locally. The matrix is generated from cargo metadata plus
    # scripts/release-feature-policy.toml instead of hand-maintained YAML.
    needs: [feature-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJson(needs.feature-policy.outputs.feature_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: feature-${{ matrix.crate }}-${{ matrix.feature }}
      - name: Check feature ${{ matrix.feature }}
        env:
          CRATE: ${{ matrix.crate }}
          FEATURE: ${{ matrix.feature }}
        run: cargo check -p "$CRATE" --features "$FEATURE"

  no-default-recipes:
    # WHY: verifies that documented no-default-features deployment recipes compile exactly
    # as written in docs/FEATURE-FLAGS.md. With defaults enabled the check can mask missing
    # dependencies in minimal builds.
    needs: [feature-policy]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.feature-policy.outputs.no_default_matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}
      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}
      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: no-default-${{ matrix.name }}
      - name: Check no-default-features recipe (${{ matrix.name }})
        env:
          CRATE: ${{ matrix.crate }}
          FEATURES: ${{ matrix.features }}
        run: |
          if [[ -n "$FEATURES" ]]; then
            cargo check -p "$CRATE" --no-default-features --features "$FEATURES"
          else
            cargo check -p "$CRATE" --no-default-features
          fi

  build:
    needs: [test, feature-check, no-default-recipes]
    permissions:
      contents: read
      attestations: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # WHY: musl produces a fully static binary — no glibc, no runtime
          # deps. Runs on any Linux kernel 3.10+ regardless of distro.
          # Covers: server, CI runner, containers, ARM boards (future).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: aletheia-linux-x86_64
            cross: true
          # WHY: native macOS build on Apple Silicon runner gets Metal
          # support for candle (local embeddings) without cross-compile.
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: aletheia-macos-aarch64
            cross: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          targets: ${{ matrix.target }}

      - uses: taiki-e/install-action@ba47c86ac325773530516bb756137ac718732518 # v2.86.5
        with:
          tool: rust-audit-info@0.5.4

      # WHY(#4945): records the ACTUAL resolved compiler rather than repeating
      # rust-toolchain.toml's pin — the two should agree, but this is the
      # measured truth that lands in the shipped artifact's own manifest.
      - name: Record resolved rustc version
        id: rustc-version
        run: echo "version=$(rustc --version)" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.cross
        run: cargo install cross --locked --version 0.2.5

      - name: Install cargo-auditable
        if: ${{ !matrix.cross }}
        run: cargo install cargo-auditable --locked --version 0.7.4

      # WHY(#6999) `-p aletheia --bin aletheia`: the previous virtual-root
      # invocation built every workspace member and unified features across
      # all of them into the shipped binary — integration-tests' NORMAL
      # dependencies switched on koina/eidos/organon/mneme `test-support`,
      # hermeneus `test-support,test-utils` and mneme `crash-injection` in
      # every released artifact, code the `--features` line never declared.
      #
      # What this build attests: package `aletheia`, bin `aletheia`, features
      # `recall,embed-candle` plus aletheia's defaults, resolved for
      # exactly this package — and nothing else in the workspace. It does
      # NOT attest any other member, bin, or feature combination; those are
      # covered by feature-check/no-default-recipes above, which check but
      # do not ship. scripts/check-release-build-scope.py replays this
      # resolution in PR CI (gate-coverage-scripts) and fails if the
      # scoping is lost or a test-only feature reappears in this graph.
      - name: Build (native)
        if: ${{ !matrix.cross }}
        run: cargo auditable build --locked --release -p aletheia --bin aletheia --target "$BUILD_TARGET" --features recall,embed-candle
        env:
          BUILD_TARGET: ${{ matrix.target }}

      - name: Build (cross)
        if: ${{ matrix.cross }}
        run: cross build --locked --release -p aletheia --bin aletheia --target "$BUILD_TARGET" --features recall,embed-candle
        env:
          BUILD_TARGET: ${{ matrix.target }}

      - name: Verify embedded auditable dependency graph
        run: |
          binary="target/${BUILD_TARGET}/release/aletheia"
          audit_dir=$(mktemp -d "$GITHUB_WORKSPACE/.release-audit.XXXXXX")
          audit_info="$audit_dir/auditable-info.json"
          rust-audit-info "$binary" > "$audit_info"
          printf 'AUDITABLE_INFO=%s\n' "$audit_info" >> "$GITHUB_ENV"
          scripts/check-auditable-info.py \
            "$audit_info" "$VERSION"
        env:
          BUILD_TARGET: ${{ matrix.target }}
          VERSION: ${{ steps.version.outputs.version }}

      - name: Package tarball
        id: artifact
        run: |
          version="${VERSION}"
          dir="aletheia-${version}"
          rm -rf "${dir}"
          mkdir -p "${dir}"
          install -m 0755 "target/${BUILD_TARGET}/release/aletheia" "${dir}/aletheia"
          cp -R docs "${dir}/"
          cp -R instance.example "${dir}/"
          cp LICENSE LICENSE-DOCS README.md SECURITY.md CHANGELOG.md Cargo.toml Cargo.lock deny.toml "${dir}/"
          PACKAGE_DIR="${dir}" \
          PACKAGE_VERSION="${version}" \
          PACKAGE_TARGET="${BUILD_TARGET}" \
          PACKAGE_ARTIFACT="${ARTIFACT}" \
          PACKAGE_FEATURES="recall,embed-candle" \
          PACKAGE_RUSTC="${{ steps.rustc-version.outputs.version }}" \
          PACKAGE_CROSS_VERSION="${{ matrix.cross && '0.2.5' || 'n/a (native build)' }}" \
          PACKAGE_SOURCE_COMMIT="$RELEASE_SHA" \
          python3 - <<'PY'
          import hashlib
          import os
          import stat
          from pathlib import Path

          root = Path(os.environ["PACKAGE_DIR"])
          manifest = root / "PACKAGE-MANIFEST.txt"
          version = os.environ["PACKAGE_VERSION"]
          target = os.environ["PACKAGE_TARGET"]
          artifact = os.environ["PACKAGE_ARTIFACT"]
          features = os.environ["PACKAGE_FEATURES"]
          source_commit = os.environ["PACKAGE_SOURCE_COMMIT"]
          rustc_version = os.environ["PACKAGE_RUSTC"]
          cross_version = os.environ["PACKAGE_CROSS_VERSION"]

          lines = [
              "Aletheia binary package manifest",
              f"version={version}",
              f"target={target}",
              f"source_commit={source_commit}",
              f"features={features}",
              # WHY(#4945): the resolved compiler + cross version that built
              # THIS artifact, not just the pin — so a shipped binary records
              # what actually built it.
              f"rustc_version={rustc_version}",
              f"cross_version={cross_version}",
              f"provenance_asset={artifact}-{version}.provenance.intoto.jsonl",
              f"cyclonedx_sbom_asset={artifact}-{version}.cdx.json",
              f"spdx_sbom_asset={artifact}-{version}.spdx.json",
              "",
              "sha256 mode bytes path",
          ]

          for path in sorted(p for p in root.rglob("*") if p.is_file() and p != manifest):
              data = path.read_bytes()
              digest = hashlib.sha256(data).hexdigest()
              file_mode = stat.S_IMODE(path.stat().st_mode)
              rel = path.relative_to(root).as_posix()
              lines.append(f"{digest} {file_mode:04o} {len(data)} {rel}")

          manifest.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
          tar czf "${ARTIFACT}-${version}.tar.gz" "${dir}"
          cp "target/${BUILD_TARGET}/release/aletheia" "${ARTIFACT}-${version}"
          echo "TARBALL=${ARTIFACT}-${version}.tar.gz" >> "$GITHUB_ENV"
          echo "BINARY=${ARTIFACT}-${version}" >> "$GITHUB_ENV"
          echo "bin=${ARTIFACT}-${version}" >> "$GITHUB_OUTPUT"
        env:
          ARTIFACT: ${{ matrix.artifact }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}

      - name: Inspect tarball contents
        run: scripts/check-release-tarball.sh "$TARBALL" "$VERSION" "$BUILD_TARGET" "$RELEASE_SHA" "$BINARY"
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD_TARGET: ${{ matrix.target }}

      # WHY here: this is the last point before the artifact can be staged.
      # check-release-tarball.sh above inspects the tarball's CONTENTS; nothing
      # yet establishes that the binary inside actually runs on the runner that
      # built it. Both matrix targets produce a natively-runnable binary, so a
      # failure here is real rather than a cross-compilation artifact.
      - name: Smoke test the release binary
        # WHY the guard echoes + explicit bash: BINARY is a bare filename
        # (PATH lookup never finds it), and a zero-output instant exit 127
        # killed a release with no evidence. `ls` proves what exists; `bash -x`
        # makes the step's own trace the evidence if it dies early again.
        run: |
          ls -l scripts/smoke-test.sh "./$BINARY"
          bash -x scripts/smoke-test.sh --binary "./$BINARY"

      - name: Verify binary version matches tag and manifests
        run: |
          scripts/check-release-versioning.py verify-release \
            --tag "$RELEASE_TAG" \
            --binary "$BINARY"

      - name: Generate checksums (Linux)
        if: runner.os == 'Linux'
        run: |
          sha256sum "$TARBALL" > "$TARBALL.sha256"
          sha256sum "$BINARY" > "$BINARY.sha256"

      - name: Generate checksums (macOS)
        if: runner.os == 'macOS'
        run: |
          shasum -a 256 "$TARBALL" > "$TARBALL.sha256"
          shasum -a 256 "$BINARY" > "$BINARY.sha256"

      # WHY: scan the cargo-auditable binary itself (file:) so syft reads its
      # embedded dependency manifest — the SBOM must describe the attested
      # subject (the binary), not the source tree.
      - name: Generate CycloneDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.artifact.outputs.bin }}
          format: cyclonedx-json
          output-file: ${{ steps.artifact.outputs.bin }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          file: ${{ steps.artifact.outputs.bin }}
          format: spdx-json
          output-file: ${{ steps.artifact.outputs.bin }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Bind SBOM package inventories to the binary
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          scripts/check-auditable-info.py \
            "$AUDITABLE_INFO" \
            "$VERSION" \
            --cyclonedx "$BINARY.cdx.json" \
            --spdx "$BINARY.spdx.json"

      - name: Attest binary provenance
        id: attest-provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.artifact.outputs.bin }}

      - name: Attest CycloneDX SBOM
        id: attest-cyclonedx-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.artifact.outputs.bin }}
          sbom-path: ${{ steps.artifact.outputs.bin }}.cdx.json

      - name: Attest SPDX SBOM
        id: attest-spdx-sbom
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.artifact.outputs.bin }}
          sbom-path: ${{ steps.artifact.outputs.bin }}.spdx.json

      # WHY: step outputs are passed through env vars, not interpolated into the
      # run block, so the shell never embeds untrusted ${{ }} expansion (GitHub
      # Actions expression-injection hardening).
      - name: Stage validated platform assets
        env:
          PROVENANCE_BUNDLE: ${{ steps.attest-provenance.outputs.bundle-path }}
          CDX_BUNDLE: ${{ steps.attest-cyclonedx-sbom.outputs.bundle-path }}
          SPDX_BUNDLE: ${{ steps.attest-spdx-sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$BINARY.provenance.intoto.jsonl"
          cp "$CDX_BUNDLE" "$BINARY.cdx.intoto.jsonl"
          cp "$SPDX_BUNDLE" "$BINARY.spdx.intoto.jsonl"
          mkdir release-stage
          cp \
            "$TARBALL" \
            "$TARBALL.sha256" \
            "$BINARY" \
            "$BINARY.sha256" \
            "$BINARY.cdx.json" \
            "$BINARY.spdx.json" \
            "$BINARY.provenance.intoto.jsonl" \
            "$BINARY.cdx.intoto.jsonl" \
            "$BINARY.spdx.intoto.jsonl" \
            release-stage/

      - name: Upload staged platform assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.artifact }}
          path: release-stage/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  sbom:
    needs: [test, feature-check]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          output-file: aletheia-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # WHY scripts/generate-sbom.sh, not a duplicate install+generate here:
      # this step used to repeat `cargo install cargo-cyclonedx --version ^0.5`
      # as a second copy of the exact version scripts/generate-sbom.sh also
      # pinned (#4945) — one fact, drifting in two places. The script is now
      # the sole owner of the pinned version; this step just calls it.
      - name: Generate CycloneDX SBOM
        run: scripts/generate-sbom.sh

      - name: Stage workspace SBOMs
        run: |
          mkdir release-stage
          cp aletheia-sbom.spdx.json bom.cdx.json release-stage/

      - name: Upload staged workspace SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-workspace-sboms
          path: release-stage/
          if-no-files-found: error
          retention-days: 7

  publish-release:
    # WHY(#5423): this is the sole public-release mutation. Every producer
    # above writes only short-lived Actions artifacts; any upstream failure
    # leaves a repairable draft with no public partial asset set.
    needs: [build, sbom]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.release_sha || github.sha }}

      - name: Download every staged release asset
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true

      - name: Validate the complete staged contract
        run: |
          scripts/check-release-assets.py \
            --directory release-assets \
            --tag "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          scripts/check-release-tarball.sh \
            "release-assets/aletheia-linux-x86_64-${version}.tar.gz" \
            "$version" x86_64-unknown-linux-musl "$RELEASE_SHA" \
            "release-assets/aletheia-linux-x86_64-${version}"
          scripts/check-release-tarball.sh \
            "release-assets/aletheia-macos-aarch64-${version}.tar.gz" \
            "$version" aarch64-apple-darwin "$RELEASE_SHA" \
            "release-assets/aletheia-macos-aarch64-${version}"
          scripts/check-release-attestations.py \
            --directory release-assets \
            --tag "$RELEASE_TAG" \
            --source-sha "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload the complete set to the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
            echo "::error::${RELEASE_TAG} is public; refusing to mutate its assets"
            exit 1
          fi
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          direct="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          peeled="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          live_tag_commit="${peeled:-$direct}"
          if [[ ! "$live_tag_commit" =~ ^[0-9a-f]{40}$ || "$live_tag_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::live ${RELEASE_TAG}=${live_tag_commit:-missing}, expected=${RELEASE_SHA}"
            exit 1
          fi
          mapfile -d '' assets < <(find release-assets -maxdepth 1 -type f -print0 | sort -z)
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber

      - name: Round-trip the draft assets before publication
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir downloaded-assets
          gh release download "$RELEASE_TAG" --dir downloaded-assets --pattern '*'
          scripts/check-release-assets.py \
            --directory downloaded-assets \
            --tag "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          scripts/check-release-tarball.sh \
            "downloaded-assets/aletheia-linux-x86_64-${version}.tar.gz" \
            "$version" x86_64-unknown-linux-musl "$RELEASE_SHA" \
            "downloaded-assets/aletheia-linux-x86_64-${version}"
          scripts/check-release-tarball.sh \
            "downloaded-assets/aletheia-macos-aarch64-${version}.tar.gz" \
            "$version" aarch64-apple-darwin "$RELEASE_SHA" \
            "downloaded-assets/aletheia-macos-aarch64-${version}"
          scripts/check-release-attestations.py \
            --directory downloaded-assets \
            --tag "$RELEASE_TAG" \
            --source-sha "$RELEASE_SHA" \
            --repo "$GITHUB_REPOSITORY"
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
            echo "::error::${RELEASE_TAG} ceased to be a draft before final publication"
            exit 1
          fi

      - name: Publish the verified draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          release_json="$(gh release view "$RELEASE_TAG" --json isDraft,tagName)"
          if [[ "$(jq -r '.isDraft' <<<"$release_json")" != "true" ]]; then
            echo "::error::${RELEASE_TAG} ceased to be a draft before publication"
            exit 1
          fi
          remote_refs="$(git ls-remote --tags origin \
            "refs/tags/${RELEASE_TAG}" "refs/tags/${RELEASE_TAG}^{}")"
          direct="$(awk '$2 !~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          peeled="$(awk '$2 ~ /\^\{\}$/ { print $1 }' <<<"$remote_refs")"
          live_tag_commit="${peeled:-$direct}"
          if [[ ! "$live_tag_commit" =~ ^[0-9a-f]{40}$ || "$live_tag_commit" != "$RELEASE_SHA" ]]; then
            echo "::error::live ${RELEASE_TAG}=${live_tag_commit:-missing}, expected=${RELEASE_SHA}"
            exit 1
          fi
          gh release edit "$RELEASE_TAG" --draft=false --verify-tag
