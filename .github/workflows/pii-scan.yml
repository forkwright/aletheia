name: PII Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Install ripgrep and bats
        uses: ./.github/actions/apt-install
        with:
          packages: ripgrep bats
          verify: command -v rg >/dev/null && command -v bats >/dev/null
      - name: Run PII scanner
        run: scripts/scan-pii.sh
      - name: Run ADR provenance guard
        run: scripts/check-adr.sh
      - name: Run scanner unit tests
        run: bats tests/pii-scanner/test_scanner.bats
