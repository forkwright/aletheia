# WHY(kanon#2522): migrates the trailer/full-gate-build mechanism onto the
# fleet-shared hybrid-gate.yml (aletheia#6426 generalized into a kanon-
# designed reusable; see
# forkwright/.github/.github/workflows/hybrid-gate.yml). Hosted in the
# public forkwright/.github repo, not forkwright/kanon: GitHub cannot
# resolve a workflow_call reference into a private repo owned by a personal
# account for other-repo callers — this adoption originally pointed at
# kanon and failed to even schedule the workflow (no run appeared at all)
# before being repointed here. Fmt/check/clippy/nextest logic lives in the
# reusable; this file supplies only aletheia's own commands/flags plus the
# two coverage jobs the reusable has no equivalent for (see below).
#
# WHY the with: values diverge from fleet default where noted — aletheia is
# the reference implementation the defaults were modeled on, so exact
# fidelity to its production commands matters more here than for any other
# adopting repo:
#   - check_cmd/clippy_cmd/nextest_cmd all carry --features test-core (and
#     nextest also carries --profile ci) that the fleet default omits. A
#     Gate-Passed trailer and a green full-gate-build must attest the same
#     invocations a local `kanon gate --stamp` run does.
#   - needs_fleet_repo_token: true (fleet default false) — Cargo.toml carries
#     a hard git dependency on forkwright/theatron.git (tag=v1.5.0). The
#     dependency is public and pinned to an immutable tag, so an
#     unauthenticated fetch resolves it today (`git ls-remote` with no
#     credential helper and no token returns the same SHA Cargo.lock pins for
#     refs/tags/v1.5.0) — but the input is kept true anyway as standing
#     insurance against anonymous git-fetch rate-limit flakiness on
#     GitHub-hosted runners, the input's documented second criterion (see
#     forkwright/.github hybrid-gate.yml). scripts/check-automation-pr-gates.py
#     enforces true unconditionally whenever Cargo.toml resolves any
#     forkwright git dependency — do not special-case a dependency as "public,
#     so no token needed" here without changing that checker first.
#   - doctest_cmd and system_packages stay at fleet default ("" / skip) — no
#     doctest step, no apt-get step in the prior inline job.
#
# WHY gate-coverage-scripts / gate-coverage-compile-checks stay as separate,
# unconditional, always-on jobs rather than folding into the hybrid-gate.yml
# call (#6433, restored 2026-07-21 after being orphaned by an earlier gate
# refactor): kanon.toml's [gate].stages / .kanon-ci.toml's pipeline — and so
# hybrid-gate.yml, which generalizes exactly that stage list — cover only
# fmt/check/clippy/nextest. They never touch check-test-tier-features.py,
# release-feature-policy.py, check/test-release-versioning.py, the
# poiesis-slides/poiesis-sheet feature-combination checks, or the fuzz-target
# compile check, so a Gate-Passed trailer cannot attest to them and the
# reusable workflow has no way to run them. Naively swapping this whole file
# for the fleet-standard caller shape would silently drop that coverage from
# the required check — these two jobs are carried forward verbatim instead.
#
# WHY the reusable call is job id `hybrid-gate`, not `gate`, with a separate
# wrapper job named `gate`: the aggregator semantics (a single required check
# that fails unless trailer-or-build succeeds AND both coverage jobs succeed)
# still need to hold, but hybrid-gate.yml's own internal `gate` job only
# knows about check-trailer/full-gate-build, not this repo's extra coverage
# jobs. The `gate` job below aggregates all three so the required check-run
# name stays the bare string `gate` — unchanged from before this migration,
# no branch-protection rename needed.
#
# WHY ai_attribution_check / docs_only_exemption ARE set below: the extended
# hybrid-gate.yml (declaring both workflow_call inputs) is now live at
# forkwright/.github. no-ai-attribution.yml stays alongside unchanged — it
# carries extra pattern/waiver coverage beyond the reusable's inline
# ai-attribution job, so this is belt-and-suspenders, not a replacement.
#
# WHY the standalone `attestation-verify` job exists (aletheia#6440): the
# reusable's own check-trailer job (forkwright/.github, not editable from
# here) accepts ANY line matching the bare prefix `^Gate-Passed:` as proof
# the tree was gated — no parse of the canonical shape, no comparison of a
# claimed sha against the tip's actual tree. `Gate-Passed: anything` on the
# PR tip is therefore sufficient, today, to skip full-gate-build entirely.
# workflow_call exposes no `outputs:` on hybrid-gate.yml, so this caller
# cannot see WHY the reusable's internal gate said success — a real
# full-gate-build and a forged trailer are indistinguishable from
# `needs.hybrid-gate.result` alone. `attestation-verify` re-derives the
# verdict independently, from the same tip commit, against the byte-exact
# shape `kanon gate --tier full --stamp` actually emits (verified against
# crates/pragma/src/commands/gate/mod.rs `finish_gate_results` in a live
# kanon clone: `kanon <version>[+scope:pkg,...] +stages:<list>
# sha:<40-hex tree>` — a tree sha, not a commit sha, because a tree survives
# the --stamp amend itself; see kanon#2134). The `gate` job below fails
# closed whenever this job finds a trailer PRESENT but INVALID, regardless
# of what hybrid-gate reported, because that report may itself be the thing
# being forged. It cannot force a rejected trailer to fall through to a
# real full-gate-build — that decision already happened inside the already-
# completed reusable call — so the systemic fix (reject-routes-to-build,
# living where check-trailer itself can react to it) still belongs in
# forkwright/.github; this is the fail-closed backstop available from the
# caller in the meantime.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# WHY: hybrid-gate.yml declares the concurrency group for the job it runs, and
# a called workflow evaluates `github.workflow` / `github.ref` in the CALLER's
# context — so for a repo whose gate workflow is only the delegating job, the
# callee's group already governs the whole run. This repo is not that shape:
# gate-coverage-scripts, gate-coverage-compile-checks and gate run here, in the
# caller, and the callee's group does not reach them. A superseded push left
# those three running against a SHA nothing would check.
#
# WARNING: the key must NOT be hybrid-gate.yml's `${{ github.workflow }}-${{
# github.ref }}`. That callee documents that a caller sharing its key makes the
# group self-cancel, since both expressions evaluate in this same caller
# context and would collide. The `-caller` infix keeps this group distinct, so
# it cancels superseded runs of the caller-side jobs while the callee keeps
# managing its own.
concurrency:
  # WHY the SHA on a push and the ref on a PR: on `main` the ref is constant, so a ref-keyed group
  # cancels the previous run every time a merge lands. Measured over one window, pushes to main were
  # 3 success / 2 CANCELLED — a merge train left main with NO verdict rather than a red one, which
  # reads identically to "not yet finished" and is never chased. Keying pushes by SHA gives every
  # merged commit its own group, so each gets a verdict; PRs keep ref-keying so a force-push still
  # supersedes its own in-flight run.
  group: ${{ github.workflow }}-caller-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  hybrid-gate:
    # WHY pinned: this reusable workflow IS the logic behind the required `gate` context. On
    # `@main` an upstream commit in another repo reddens every open PR here with no change to
    # this one — the same class as the gitignored fuzz lockfile (#6655), at a larger blast
    # radius. Bump deliberately, so the change is reviewable.
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@54f1af7c711546304409593695e1258a91004453
    with:
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --workspace --all-targets --features test-core"
      clippy_cmd: "cargo clippy --workspace --all-targets --features test-core -- -D warnings"
      nextest_cmd: "cargo nextest run --profile ci --workspace --features test-core"
      doctest_cmd: ""
      system_packages: ""
      needs_fleet_repo_token: true
      rust_cache_key: "gate-attestation"
      full_gate_timeout_minutes: 45
      ai_attribution_check: true
      docs_only_exemption: true
    secrets: inherit

  attestation-verify:
    name: attestation-verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      trailer_present: ${{ steps.verify.outputs.trailer_present }}
      trailer_valid: ${{ steps.verify.outputs.trailer_valid }}
    # WHY no `needs:` on hybrid-gate: this job must reach its verdict from the
    # tip commit alone, never from hybrid-gate's own (potentially forged)
    # result — see the top-of-file WHY(aletheia#6440) for the full threat
    # model. Running unconditionally in parallel also keeps this job off
    # hybrid-gate's critical path.
    steps:
      # WHY(filter): this job reads a commit message, one kanon.toml, and a
      # tree hash -- it never builds. Cloning every blob under a 5-minute
      # budget is what makes it time out, and an overrun reports `cancelled`,
      # which the gate cannot distinguish from a supersede: the PR then reads
      # as a gate failure caused by nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - name: Verify Gate-Passed trailer binds to the tip's tree
        id: verify
        env:
          # WHY head.sha over HEAD (mirrors hybrid-gate.yml's check-trailer):
          # on a pull_request event the checked-out HEAD is a synthetic merge
          # commit GitHub builds on the fly, whose message carries no
          # trailer. head.sha is the actual PR branch tip — empty on a push,
          # where HEAD already IS the tip.
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tip="${PR_HEAD_SHA:-HEAD}"
          body=$(git log -1 --format="%B" "$tip")
          # WHY tail -1, not head -1: mirrors kanon's own re-stamp logic
          # (gate_already_passed) — the LAST Gate-Passed line is the one a
          # re-stamp replaced, so an earlier, superseded line must not win.
          trailer=$(printf '%s\n' "$body" | grep -E '^Gate-Passed:' | tail -1 || true)

          if [ -z "$trailer" ]; then
            echo "trailer_present=false" >> "$GITHUB_OUTPUT"
            echo "trailer_valid=false" >> "$GITHUB_OUTPUT"
            echo "No Gate-Passed trailer on tip ($tip); the required gate defers to hybrid-gate's full-gate-build result for this commit."
            exit 0
          fi
          echo "trailer_present=true" >> "$GITHUB_OUTPUT"
          echo "Candidate trailer on tip ($tip): $trailer"

          # WHY derived from kanon.toml, never a second hand-typed list: this
          # repo's [gate].stages is already the one place that names what a
          # Gate-Passed trailer must attest (see kanon.toml's own
          # WHY(#6363) on the deliberately-excluded lint stage) — restating
          # the list here would drift from it silently the next time it
          # changes.
          required_stages=$(python3 -c "import tomllib; print('\n'.join(tomllib.load(open('kanon.toml','rb'))['gate']['stages']))")

          # WHY this exact shape: byte-for-byte what `kanon gate --tier full
          # --stamp` emits (verified against crates/pragma/src/commands/
          # gate/mod.rs `finish_gate_results` in a live kanon clone) — an
          # optional `+scope:pkg,...` token for a package-scoped run, a
          # mandatory `+stages:a,b,c` token, and a mandatory `sha:<40-hex>`
          # tree binding. The old sha-less shape kanon's own re-stamp logic
          # treats as STALE (kanon#2134) is rejected here too, not
          # grandfathered.
          if ! printf '%s\n' "$trailer" \
              | grep -qE '^Gate-Passed: kanon [0-9][0-9A-Za-z.+_-]*( \+scope:[^ ]+)? \+stages:[a-z]+(,[a-z]+)* sha:[0-9a-f]{40}$'; then
            echo "::error::malformed Gate-Passed trailer on tip ($tip): $trailer"
            echo "Expected shape: Gate-Passed: kanon <version> [+scope:pkg,...] +stages:<list> sha:<40-hex tree sha>"
            echo "trailer_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          stages_token=$(printf '%s\n' "$trailer" | grep -oE '\+stages:[a-z,]+' | sed 's/^+stages://')
          missing=""
          while IFS= read -r stage; do
            [ -z "$stage" ] && continue
            case ",${stages_token}," in
              *",${stage},"*) ;;
              *) missing="${missing} ${stage}" ;;
            esac
          done <<< "$required_stages"
          if [ -n "$missing" ]; then
            echo "::error::trailer stage coverage '$stages_token' on tip ($tip) is missing required stage(s):$missing"
            echo "kanon.toml [gate].stages requires: $(printf '%s' "$required_stages" | tr '\n' ' ')"
            echo "trailer_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # WHY tree, not commit: `kanon gate --stamp` amends the commit
          # message to add the trailer, which changes the commit sha but not
          # the tree sha — binding to the commit would make every stamp
          # self-invalidate the instant it was written. The tree sha changes
          # exactly when content changes (a later amend, rebase, or squash
          # onto a different tree), which is the staleness signal this check
          # exists to catch.
          claimed=$(printf '%s\n' "$trailer" | grep -oE 'sha:[0-9a-f]{40}' | sed 's/^sha://')
          actual=$(git rev-parse "${tip}^{tree}")
          if [ "$claimed" != "$actual" ]; then
            echo "::error::trailer tree sha $claimed does not match tip $tip's actual tree $actual"
            echo "The tree changed after stamping (amend, rebase, or squash) — re-run 'kanon gate --tier full --stamp' on the current tip."
            echo "trailer_valid=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Gate-Passed trailer verified: stage coverage complete, tree-bound to tip ($actual)."
          echo "trailer_valid=true" >> "$GITHUB_OUTPUT"

  gate-coverage-scripts:
    name: gate-coverage-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHY(#6433): pure-python, no compile — restores per-PR coverage that
    # kanon.toml/.kanon-ci.toml never carried. Runs unconditionally (no
    # dependency on check-trailer) on every PR, including trusted-automation
    # PRs that the hybrid-gate waiver exempts, since these checks have no
    # trailer/local-gate relationship to waive.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Check test tier features
        run: scripts/check-test-tier-features.py

      # WHY(#6523): ubuntu-latest carries no ripgrep, and the check consumed rg
      # through a process substitution whose failure it discarded — so this job,
      # one of the three the required `gate` context aggregates, reported
      # success on every PR without scanning anything.
      - name: Install ripgrep
        # WHY the explicit assertion: this job's own history records that ripgrep's ABSENCE once
        # let it report success without scanning anything (#6523). An install that half-fails must
        # stop the job, not quietly disarm the check it feeds.
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends ripgrep
          command -v rg >/dev/null || { echo '::error::ripgrep missing after install'; exit 1; }

      - name: Check shared temp paths
        run: scripts/check-shared-temp-paths.sh

      - name: Check release feature policy
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          scripts/release-feature-policy.py --metadata metadata.json validate

      - name: Release versioning
        run: |
          scripts/check-release-versioning.py
          scripts/test-release-versioning.py

      - name: Diaporeia MCP inventory generator tests
        run: scripts/test-diaporeia-mcp-inventory.py

      # WHY: the pin check compares proskenion's theatron pins against the ROOT
      # Cargo.toml, but its only PR-time home was desktop.yml, whose paths
      # filter covers crates/theatron/proskenion/**, crates/theatron/skene/**,
      # scripts/*proskenion* and desktop.yml itself — not the root manifest.
      # So a PR that re-pinned theatron in the root workspace drifted the two
      # manifests apart with the check never running, and the failure surfaced
      # later on an unrelated PR that happened to touch a proskenion path.
      # Running it here binds it to every PR; it is pure-python, no compile.
      - name: Check proskenion theatron pins
        run: scripts/check-proskenion-pins.py

      - name: Check workspace lockfiles are tracked
        run: scripts/check-workspace-locks.py

      - name: Check for unresolved conflict markers
        run: scripts/check-conflict-markers.py

      # WHY: cargo silently ignores a .rs file under a crate's src/ tree
      # that no `mod` declaration reaches -- it does not compile in, so a
      # file `git mv`'d without its `mod` line following it (or one that
      # never had a `mod` line added) rots invisibly with no build failure
      # to surface it. Pure-python, no compile, so it runs here.
      - name: Test check-orphaned-modules.py
        run: scripts/test-check-orphaned-modules.py

      - name: Check for orphaned modules
        run: scripts/check-orphaned-modules.py

      # WHY(PLAN.md §0.2/wave-0.2): the mechanically-derived module DAG is
      # the SSOT the plan's §7 parallelism map must match — pure-python, no
      # compile, so it runs here like the other coverage checks. Drift means
      # either the crate's import graph moved (re-derive the snapshots and
      # re-check §7) or a hand-edit touched a generated file (revert it).
      - name: Check krites module-dag drift
        run: |
          scripts/krites-module-dag.py --check crates/krites/module-dag.json
          scripts/krites-module-dag.py --format markdown --check crates/krites/module-dag.md
          scripts/krites-module-dag.py --wave-scope --check crates/krites/module-dag.wave-scope.json

      # WHY: krites retirement plan wave 0.4 (metis-ops/deliverables/
      # krites-replacement/PLAN.md Sec 3, kill criterion 10). `unmapped` --
      # a SysOp variant, DataValue variant, or public Db-boundary item
      # present in source with no row in crates/krites/CAPABILITY_MATRIX.toml
      # -- is a build failure by design: the five capabilities lost from the
      # prior retirement plan (MinHash LSH, time-travel/Validity, triggers,
      # access levels, query registry) were all zero-call-site items nobody
      # would have missed at review time. Runs unconditionally like the
      # other pure-python checks in this job, not path-scoped, so a PR that
      # touches krites without touching the matrix still gets caught.
      - name: Check krites capability-coverage matrix
        run: scripts/check-krites-capability-matrix.py

      # WHY: krites retirement plan wave 0.1 (metis-ops/deliverables/
      # krites-replacement/PLAN.md §3, kill criterion 8). The anti-backslide
      # gate for crates/krites/PROVENANCE.toml: completeness, NOTICE.md
      # sync, no derived-row regression, status-sequence (derived -> dual ->
      # sovereign, no direct jump), soak expiry, offline verbatim recompute.
      # Runs here, not as a standalone workflow — gate-coverage-scripts
      # feeds the required `gate` check, so a standalone workflow (the
      # prior shape) could report failure without ever blocking a merge.
      # --base-ref: on `push` (post-merge to main), `origin/main` already
      # IS the just-pushed commit by checkout time, so comparing against it
      # is a self-comparison no-op that can never detect a regression —
      # `github.event.before` (the pre-push SHA) is used on that trigger
      # instead. On `pull_request`, `origin/<base_ref>` is the PR's actual
      # merge target and needs no such substitution.
      - name: Check krites provenance ledger
        run: |
          python3 scripts/check-krites-provenance.py \
            --base-ref "${{ github.event_name == 'push' && github.event.before || format('origin/{0}', github.base_ref || 'main') }}"

      - name: Krites provenance checker self-tests
        run: scripts/test-krites-provenance.py

  gate-coverage-compile-checks:
    name: gate-coverage-compile-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WHY(#6433): same rationale as gate-coverage-scripts — the poiesis
    # feature-combination checks and the fuzz-target compile check are also
    # absent from kanon.toml/.kanon-ci.toml (and so from hybrid-gate.yml),
    # so they run here, always-on, rather than only inside full-gate-build
    # (which a stamped PR skips).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: gate-coverage-compile

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Poiesis feature gates
        run: |
          cargo check -p poiesis-slides
          cargo check -p poiesis-slides --no-default-features
          cargo check -p poiesis-sheet
          cargo check -p poiesis-sheet --no-default-features --features workbook

      # WHY(#4473): gate-attestation's hybrid-gate check_cmd only builds default +
      # --features test-core, so a gated provider feature (codex-provider,
      # kimi-provider, ...) can break silently — #4468 shipped exactly that: a
      # derive that only fails under codex-provider stayed broken on main until
      # #4470. NOT --all-features (z3-sys); this is the deployment feature set
      # used on metis.
      - name: Aletheia gated-provider feature gate
        run: cargo check -p aletheia --features mcp,energeia,codex-provider,kimi-provider,keyring

      - name: cargo check fuzz targets
        env:
          CARGO_TARGET_DIR: target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  gate:
    name: gate
    needs: [hybrid-gate, gate-coverage-scripts, gate-coverage-compile-checks, attestation-verify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate result
        env:
          HYBRID_GATE_RESULT: ${{ needs.hybrid-gate.result }}
          COVERAGE_SCRIPTS_RESULT: ${{ needs.gate-coverage-scripts.result }}
          COVERAGE_COMPILE_RESULT: ${{ needs.gate-coverage-compile-checks.result }}
          ATTESTATION_VERIFY_RESULT: ${{ needs.attestation-verify.result }}
          TRAILER_PRESENT: ${{ needs.attestation-verify.outputs.trailer_present }}
          TRAILER_VALID: ${{ needs.attestation-verify.outputs.trailer_valid }}
        run: |
          # WHY(#6440) checked FIRST, unconditionally, ahead of every other
          # verdict below: hybrid-gate.yml's own check-trailer job trusts a bare
          # `^Gate-Passed:` prefix match with no shape, stage, or tree
          # validation, so HYBRID_GATE_RESULT can read "success" purely
          # because a forged trailer satisfied that weak check and skipped
          # full-gate-build — see attestation-verify's own WHY for the full
          # threat model. A PR tip carrying a trailer that fails this repo's
          # independent re-verification must not merge on the strength of
          # hybrid-gate's report, because that report may be the thing being
          # forged. No trailer at all is NOT this case — check-trailer sees
          # the same absence and runs a real full-gate-build, so that path is
          # still governed by HYBRID_GATE_RESULT below.
          case "$ATTESTATION_VERIFY_RESULT" in
            success) ;;
            cancelled|skipped)
              echo "CANCELLED: attestation-verify did not run to a verdict (result: ${ATTESTATION_VERIFY_RESULT}). This is NOT a check failure: re-run the job. See aletheia#6701." >&2
              exit 1
              ;;
            *)
              echo "ERROR: attestation-verify did not succeed (result: ${ATTESTATION_VERIFY_RESULT})." >&2
              exit 1
              ;;
          esac
          if [ "$TRAILER_PRESENT" = "true" ] && [ "$TRAILER_VALID" != "true" ]; then
            echo "ERROR: PR tip carries a Gate-Passed trailer that failed independent verification" >&2
            echo "(malformed shape, incomplete stage coverage, or bound to a different tree)." >&2
            echo "Run 'kanon gate --tier full --stamp' on the current tip to produce a valid trailer," >&2
            echo "or drop it so full-gate-build runs for real." >&2
            exit 1
          fi

          # WHY(#6433): gate-coverage-* jobs are NOT part of hybrid-gate.yml's
          # trusted-automation waiver — unlike fmt/check/clippy/nextest (which
          # a dispatch worker or bot PR may legitimately be unable to stamp
          # locally), these are plain always-on CI jobs with no trailer/
          # local-gate relationship, so coverage holds for every PR,
          # dependabot/release-please included. hybrid-gate.yml's own
          # internal `gate` job already applies the trusted-automation waiver
          # to the trailer/build path, so HYBRID_GATE_RESULT alone reflects
          # that waiver correctly — no separate waiver check needed here.
          # WHY cancelled is called out rather than folded into the failure
          # branch: a cancelled upstream job is not a verdict, and reporting it as
          # one is actively misleading. On a push to main the callee keys its
          # concurrency group by github.ref -- constant there -- so the next merge
          # cancels the previous commit's hybrid gate while this caller's own
          # SHA-keyed jobs survive. Measured over one window, two consecutive
          # merges each came out RED with nothing wrong: 53ba8110b and 8dd94b02c,
          # caller-side jobs green, every callee-side job cancelled. A red that
          # nobody caused trains people to discount red.
          # The exit status stays 1 either way -- an unverified commit must not
          # report success -- but the message now says which of the two happened,
          # so a cancellation is chased as a re-run and a failure as a bug. Root
          # cause is aletheia#6701; this only stops the two being
          # indistinguishable at a glance.
          case "$HYBRID_GATE_RESULT" in
            success) ;;
            cancelled|skipped)
              echo "::warning::hybrid gate was ${HYBRID_GATE_RESULT}, not failed -- no verdict was produced for this commit."
              echo "CANCELLED: hybrid gate (trailer/full-gate-build via the fleet reusable) did not run to a verdict (result: ${HYBRID_GATE_RESULT}). This is NOT a test failure: re-run the job. See aletheia#6701." >&2
              exit 1
              ;;
            *)
              echo "ERROR: hybrid gate (trailer/full-gate-build via the fleet reusable) did not succeed (result: ${HYBRID_GATE_RESULT})." >&2
              exit 1
              ;;
          esac

          case "$COVERAGE_SCRIPTS_RESULT" in
            success) ;;
            cancelled|skipped)
              echo "CANCELLED: gate-coverage-scripts did not run to a verdict (result: ${COVERAGE_SCRIPTS_RESULT}). This is NOT a check failure: re-run the job. See aletheia#6701." >&2
              exit 1
              ;;
            *)
              echo "ERROR: gate-coverage-scripts did not succeed (result: ${COVERAGE_SCRIPTS_RESULT})." >&2
              exit 1
              ;;
          esac

          case "$COVERAGE_COMPILE_RESULT" in
            success) ;;
            cancelled|skipped)
              echo "CANCELLED: gate-coverage-compile-checks did not run to a verdict (result: ${COVERAGE_COMPILE_RESULT}). This is NOT a check failure: re-run the job. See aletheia#6701." >&2
              exit 1
              ;;
            *)
              echo "ERROR: gate-coverage-compile-checks did not succeed (result: ${COVERAGE_COMPILE_RESULT})." >&2
              exit 1
              ;;
          esac

          echo "All gate stages passed (hybrid gate + coverage scripts + coverage compile checks)."
