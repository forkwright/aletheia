# WHY(#6363,#6421): a pure trailer-verify bought throughput (45-min build ×
# many PRs) but blocks any PR carrying no local Gate-Passed stamp — including
# PRs opened by dispatch workers or orchestration flows that cannot run
# `kanon gate --stamp` locally. Hybrid: check-trailer stays the fast path for
# stamped PRs; a PR with no trailer falls back to a real CI build of the exact
# stages kanon.toml's [gate].stages attests (fmt, check, clippy, nextest) so
# the required check is never bypassable and never unconditionally slow.
name: Gate Attestation

on:
  pull_request:
    branches: [main]

# PROJECT: explicit top-level default deny; job-level permissions grant only what's needed
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check-trailer:
    name: check-trailer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      found: ${{ steps.trailer.outputs.found }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for Gate-Passed trailer
        id: trailer
        # WHY: waiver keys off the PR author login, not github.actor — actor flips
        # to a maintainer login on "Re-run failed jobs", re-arming the check on bot
        # PRs. Release-please is waived branch-shaped (see forkwright/.github's
        # reusable gate-attestation for the same rationale). A trailer NOT found is
        # a normal outcome routed to full-gate-build — this step never exits 1.
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "release-please[bot]" ] || [[ "$PR_HEAD_REF" == release-please--branches--* ]]; then
            echo "Gate attestation waived for trusted automation PR (author ${PR_AUTHOR}, branch ${PR_HEAD_REF})."
            echo "found=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          commits=$(git log --format="%H" "origin/${{ github.base_ref }}..HEAD")
          found=false
          for sha in $commits; do
            body=$(git log -1 --format="%b" "$sha")
            if echo "$body" | grep -q "^Gate-Passed:"; then
              echo "Found gate attestation: $(echo "$body" | grep '^Gate-Passed:' | head -1)"
              found=true
              break
            fi
          done

          echo "found=$found" >> "$GITHUB_OUTPUT"
          if [ "$found" = false ]; then
            echo "No Gate-Passed trailer found; routing to full-gate-build."
          fi

  full-gate-build:
    name: full-gate-build
    needs: check-trailer
    if: needs.check-trailer.outputs.found != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # WHY: full debuginfo is the bulk of the dev-profile target dir; with a
      # cold cargo cache the workspace test build exceeded the hosted runner's
      # free disk (ENOSPC killed the gate mid-nextest, 2026-06-11). Line tables
      # keep usable backtraces for test failures at a fraction of the size.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # WHY: hosted runners ship ~25 GB of toolchains this job never uses
      # (dotnet, Android, GHC, CodeQL bundles). The workspace test build needs
      # that headroom when the cargo cache is cold — ENOSPC killed the gate
      # mid-nextest on 2026-06-11. Plain rm keeps this dependency-free.
      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "free disk after reclaim:"
          df -h / | tail -1

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: gate-attestation

      - name: Configure git credentials for private fleet deps
        env:
          FLEET_REPO_TOKEN: ${{ secrets.FLEET_REPO_TOKEN }}
        run: |
          if [ -z "${FLEET_REPO_TOKEN}" ]; then
            echo "FLEET_REPO_TOKEN is not set; private fleet deps will fail to fetch." >&2
            exit 1
          fi
          git config --global credential.helper store
          printf 'https://forkwright:%s@github.com\n' "${FLEET_REPO_TOKEN}" > ~/.git-credentials
          chmod 0600 ~/.git-credentials

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7a79fe8c3a13344501c80d99cae481c1c9085912 # v2
        with:
          tool: nextest

      # WHY: these four steps are the exact stages kanon.toml's [gate].stages
      # attests (fmt, check, clippy, nextest) — a Gate-Passed trailer and a
      # green full-gate-build must mean the same thing. Keep this list in sync
      # with kanon.toml; do not add or drop a stage in only one place.
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check

      - name: cargo check --workspace --all-targets --features test-core
        run: cargo check --workspace --all-targets --features test-core

      - name: cargo clippy --workspace --all-targets --features test-core -- -D warnings
        run: cargo clippy --workspace --all-targets --features test-core -- -D warnings

      - name: cargo nextest run --profile ci --workspace --features test-core
        run: cargo nextest run --profile ci --workspace --features test-core

      - name: Upload nextest failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nextest-gate-attestation
          path: |
            target/nextest/ci/junit.xml
            target/nextest/**/*.log
          if-no-files-found: warn

  gate:
    name: gate
    needs: [check-trailer, full-gate-build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate result
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.head_ref }}
          TRAILER_FOUND: ${{ needs.check-trailer.outputs.found }}
          BUILD_RESULT: ${{ needs.full-gate-build.result }}
        run: |
          if [ "$PR_AUTHOR" = "dependabot[bot]" ] || [ "$PR_AUTHOR" = "release-please[bot]" ] || [[ "$PR_HEAD_REF" == release-please--branches--* ]]; then
            echo "Gate attestation waived for trusted automation PR (author ${PR_AUTHOR}, branch ${PR_HEAD_REF})."
            exit 0
          fi

          if [ "$TRAILER_FOUND" = "true" ]; then
            echo "Gate-Passed trailer verified."
            exit 0
          fi

          if [ "$BUILD_RESULT" = "success" ]; then
            echo "full-gate-build passed."
            exit 0
          fi

          echo "ERROR: no Gate-Passed trailer and full-gate-build did not succeed (result: ${BUILD_RESULT})." >&2
          exit 1
