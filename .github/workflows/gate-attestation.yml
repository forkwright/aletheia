# WHY(kanon#2522): migrates the trailer/full-gate-build mechanism onto the
# fleet-shared hybrid-gate.yml (aletheia#6426 generalized into a kanon-
# designed reusable; see
# forkwright/.github/.github/workflows/hybrid-gate.yml). Hosted in the
# public forkwright/.github repo, not forkwright/kanon: GitHub cannot
# resolve a workflow_call reference into a private repo owned by a personal
# account for other-repo callers — this adoption originally pointed at
# kanon and failed to even schedule the workflow (no run appeared at all)
# before being repointed here. Fmt/check/clippy/nextest logic lives in the
# reusable; this file supplies only aletheia's own commands/flags plus the
# two coverage jobs the reusable has no equivalent for (see below).
#
# WHY the with: values diverge from fleet default where noted — aletheia is
# the reference implementation the defaults were modeled on, so exact
# fidelity to its production commands matters more here than for any other
# adopting repo:
#   - check_cmd/clippy_cmd/nextest_cmd all carry --features test-core (and
#     nextest also carries --profile ci) that the fleet default omits. A
#     Gate-Passed trailer and a green full-gate-build must attest the same
#     invocations a local `kanon gate --stamp` run does.
#   - needs_fleet_repo_token: true (fleet default false) — Cargo.toml carries
#     a hard git dependency on forkwright/theatron.git (tag=v1.3.0).
#   - doctest_cmd and system_packages stay at fleet default ("" / skip) — no
#     doctest step, no apt-get step in the prior inline job.
#
# WHY gate-coverage-scripts / gate-coverage-compile-checks stay as separate,
# unconditional, always-on jobs rather than folding into the hybrid-gate.yml
# call (#6433, restored 2026-07-21 after being orphaned by an earlier gate
# refactor): kanon.toml's [gate].stages / .kanon-ci.toml's pipeline — and so
# hybrid-gate.yml, which generalizes exactly that stage list — cover only
# fmt/check/clippy/nextest. They never touch check-test-tier-features.py,
# release-feature-policy.py, check/test-release-versioning.py, the
# poiesis-slides/poiesis-sheet feature-combination checks, or the fuzz-target
# compile check, so a Gate-Passed trailer cannot attest to them and the
# reusable workflow has no way to run them. Naively swapping this whole file
# for the fleet-standard caller shape would silently drop that coverage from
# the required check — these two jobs are carried forward verbatim instead.
#
# WHY the reusable call is job id `hybrid-gate`, not `gate`, with a separate
# wrapper job named `gate`: the aggregator semantics (a single required check
# that fails unless trailer-or-build succeeds AND both coverage jobs succeed)
# still need to hold, but hybrid-gate.yml's own internal `gate` job only
# knows about check-trailer/full-gate-build, not this repo's extra coverage
# jobs. The `gate` job below aggregates all three so the required check-run
# name stays the bare string `gate` — unchanged from before this migration,
# no branch-protection rename needed.
#
# WHY no concurrency: block here — dropped as part of adopting hybrid-gate.yml
# (which now declares `concurrency: group: ${{ github.workflow }}-${{
# github.ref }}` itself; its own comment states callers must not duplicate
# that key, or the shared group self-cancels). Prior to this migration this
# file set its own key (`${{ github.workflow }}-${{
# github.event.pull_request.number || github.ref }}`) covering all jobs
# including the two coverage jobs; omitting it means a rapid re-push no
# longer pre-empts an in-flight gate-coverage-scripts/compile-checks run for
# the same PR. This is a CI-minutes cost only, not a correctness regression:
# required-status-checks evaluates against the PR's current head SHA, so a
# superseded push's now-stale run cannot block or falsely pass merge — it
# just runs to completion against a SHA nothing checks anymore.
#
# WHY ai_attribution_check / docs_only_exemption ARE set below: the extended
# hybrid-gate.yml (declaring both workflow_call inputs) is now live at
# forkwright/.github. no-ai-attribution.yml stays alongside unchanged — it
# carries extra pattern/waiver coverage beyond the reusable's inline
# ai-attribution job, so this is belt-and-suspenders, not a replacement.
name: Gate Attestation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  hybrid-gate:
    uses: forkwright/.github/.github/workflows/hybrid-gate.yml@main
    with:
      fmt_cmd: "cargo fmt --all -- --check"
      check_cmd: "cargo check --workspace --all-targets --features test-core"
      clippy_cmd: "cargo clippy --workspace --all-targets --features test-core -- -D warnings"
      nextest_cmd: "cargo nextest run --profile ci --workspace --features test-core"
      doctest_cmd: ""
      system_packages: ""
      needs_fleet_repo_token: true
      rust_cache_key: "gate-attestation"
      full_gate_timeout_minutes: 45
      ai_attribution_check: true
      docs_only_exemption: true
    secrets: inherit

  gate-coverage-scripts:
    name: gate-coverage-scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # WHY(#6433): pure-python, no compile — restores per-PR coverage that
    # kanon.toml/.kanon-ci.toml never carried. Runs unconditionally (no
    # dependency on check-trailer) on every PR, including trusted-automation
    # PRs that the hybrid-gate waiver exempts, since these checks have no
    # trailer/local-gate relationship to waive.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Check test tier features
        run: scripts/check-test-tier-features.py

      # WHY(#6523): ubuntu-latest carries no ripgrep, and the check consumed rg
      # through a process substitution whose failure it discarded — so this job,
      # one of the three the required `gate` context aggregates, reported
      # success on every PR without scanning anything.
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Check shared temp paths
        run: scripts/check-shared-temp-paths.sh

      - name: Check release feature policy
        run: |
          cargo metadata --format-version 1 --no-deps > metadata.json
          scripts/release-feature-policy.py --metadata metadata.json validate

      - name: Release versioning
        run: |
          scripts/check-release-versioning.py
          scripts/test-release-versioning.py

  gate-coverage-compile-checks:
    name: gate-coverage-compile-checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # WHY(#6433): same rationale as gate-coverage-scripts — the poiesis
    # feature-combination checks and the fuzz-target compile check are also
    # absent from kanon.toml/.kanon-ci.toml (and so from hybrid-gate.yml),
    # so they run here, always-on, rather than only inside full-gate-build
    # (which a stamped PR skips).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@631a55b12751854ce901bb631d5902ceb48146f7 # stable
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          key: gate-coverage-compile

      - name: Configure git credentials for fleet deps
        uses: ./.github/actions/fleet-git-credentials
        with:
          token: ${{ secrets.FLEET_REPO_TOKEN }}

      - name: Poiesis feature gates
        run: |
          cargo check -p poiesis-slides
          cargo check -p poiesis-slides --no-default-features
          cargo check -p poiesis-sheet
          cargo check -p poiesis-sheet --no-default-features --features workbook

      - name: cargo check fuzz targets
        env:
          CARGO_TARGET_DIR: target
        run: cargo check --manifest-path fuzz/Cargo.toml --bins

  gate:
    name: gate
    needs: [hybrid-gate, gate-coverage-scripts, gate-coverage-compile-checks]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate gate result
        env:
          HYBRID_GATE_RESULT: ${{ needs.hybrid-gate.result }}
          COVERAGE_SCRIPTS_RESULT: ${{ needs.gate-coverage-scripts.result }}
          COVERAGE_COMPILE_RESULT: ${{ needs.gate-coverage-compile-checks.result }}
        run: |
          # WHY(#6433): gate-coverage-* jobs are NOT part of hybrid-gate.yml's
          # trusted-automation waiver — unlike fmt/check/clippy/nextest (which
          # a dispatch worker or bot PR may legitimately be unable to stamp
          # locally), these are plain always-on CI jobs with no trailer/
          # local-gate relationship, so coverage holds for every PR,
          # dependabot/release-please included. hybrid-gate.yml's own
          # internal `gate` job already applies the trusted-automation waiver
          # to the trailer/build path, so HYBRID_GATE_RESULT alone reflects
          # that waiver correctly — no separate waiver check needed here.
          if [ "$HYBRID_GATE_RESULT" != "success" ]; then
            echo "ERROR: hybrid gate (trailer/full-gate-build via the fleet reusable) did not succeed (result: ${HYBRID_GATE_RESULT})." >&2
            exit 1
          fi

          if [ "$COVERAGE_SCRIPTS_RESULT" != "success" ]; then
            echo "ERROR: gate-coverage-scripts did not succeed (result: ${COVERAGE_SCRIPTS_RESULT})." >&2
            exit 1
          fi

          if [ "$COVERAGE_COMPILE_RESULT" != "success" ]; then
            echo "ERROR: gate-coverage-compile-checks did not succeed (result: ${COVERAGE_COMPILE_RESULT})." >&2
            exit 1
          fi

          echo "All gate stages passed (hybrid gate + coverage scripts + coverage compile checks)."
