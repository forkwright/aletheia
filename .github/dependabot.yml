version: 2

updates:
  # Rust crates (the core system)
  #
  # WARNING: `directories`, not `directory`. `/fuzz` is EXCLUDED from the root
  # workspace and carries its own `Cargo.lock` (own workspace by cargo-fuzz
  # convention), so a scan rooted at `/` resolves neither it nor its
  # dependencies. A new excluded workspace needs its own row here -- nothing
  # fails when one is missing, which is why this class of gap goes unnoticed.
  #
  # WHY crates/theatron/proskenion is NOT listed (forkwright/aletheia#4726):
  # it moved from `[workspace].exclude` into `[workspace].members` and no
  # longer carries its own `Cargo.lock` -- it resolves against the ONE root
  # lockfile now, so the `/` scan below already covers its dependencies.
  - package-ecosystem: cargo
    directories:
      - /
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types: [patch]
      minor-updates:
        update-types: [minor]
    # WHY(2026-09-08): the platform-default cooldown holds a git dependency's
    # freshest tag back from consideration for a few days -- 2026-09-07's
    # "Dependabot" run (job_1562352864) crashed processing koinon because its
    # v0.3.0 tag (already the version pinned in Cargo.toml/Cargo.lock) was
    # inside cooldown, and the updater's fallback wrote a temp manifest that
    # still required "^0.3.0" against the older v0.2.1 tag it fell back to --
    # `error: failed to select a version for the requirement koinon = "^0.3.0"`.
    # Cooldown exists to let a brand-new THIRD-PARTY release prove itself
    # before we pick it up; these nine `[workspace.dependencies.*]` entries
    # (see Cargo.toml) are our own forkwright/* fleet repos, each already
    # gated by its own release pipeline before it tags, so there is no
    # freshness risk to protect against here -- only the crash to avoid.
    cooldown:
      exclude:
        - epitelesis
        - heurema
        - koinon
        - parodos
        - themelion
        - skeue
        - gramma
        - bathron
        - keryx
    reviewers:
      - forkwright

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
