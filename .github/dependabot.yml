version: 2

updates:
  # Rust crates (the core system)
  #
  # WARNING: `directories`, not `directory`. Two manifests here are EXCLUDED
  # from the root workspace and carry their own `Cargo.lock`, so a scan rooted
  # at `/` resolves neither and their dependencies are never updated:
  #   - crates/theatron/proskenion  (excluded for GTK3/webkit2gtk; see Cargo.toml)
  #   - fuzz                        (own workspace by cargo-fuzz convention)
  # proskenion is the shipped desktop frontend, so the surface this omitted is
  # the one that reaches users. A new excluded workspace needs a row here --
  # nothing fails when one is missing, which is why both went unnoticed.
  - package-ecosystem: cargo
    directories:
      - /
      - /crates/theatron/proskenion
      - /fuzz
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      patch-updates:
        update-types: [patch]
      minor-updates:
        update-types: [minor]
    # WHY(2026-09-08): the platform-default cooldown holds a git dependency's
    # freshest tag back from consideration for a few days -- 2026-09-07's
    # "Dependabot" run (job_1562352864) crashed processing koinon because its
    # v0.3.0 tag (already the version pinned in Cargo.toml/Cargo.lock) was
    # inside cooldown, and the updater's fallback wrote a temp manifest that
    # still required "^0.3.0" against the older v0.2.1 tag it fell back to --
    # `error: failed to select a version for the requirement koinon = "^0.3.0"`.
    # Cooldown exists to let a brand-new THIRD-PARTY release prove itself
    # before we pick it up; these nine `[workspace.dependencies.*]` entries
    # (see Cargo.toml) are our own forkwright/* fleet repos, each already
    # gated by its own release pipeline before it tags, so there is no
    # freshness risk to protect against here -- only the crash to avoid.
    cooldown:
      exclude:
        - epitelesis
        - heurema
        - koinon
        - parodos
        - themelion
        - skeue
        - gramma
        - bathron
        - keryx
    reviewers:
      - forkwright

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        update-types: [minor, patch]
