[package]
name = "poiesis-theme"
version.workspace = true
description = "Theme registry, token model, and brand-asset sinks (CSS, OOXML clrScheme, Pandoc doc-vars) for poiesis"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
# WHY: default-features=false on indexmap drops `std` and `RandomState` hasher.
# Re-enable `std` so `IndexMap<K, V>` (without explicit hasher type) compiles.
indexmap = { version = "=2.14.1", default-features = false, features = ["serde", "std"] }
jiff = { workspace = true }
poiesis-core = { path = "../core" }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
toml = { workspace = true }
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = { version = "=3.27.0", default-features = false }

[lints]
workspace = true
