# krites capability-coverage matrix (wave 0.4 of the retirement plan).
#
# One row per capability the crate exposes: every `SysOp` variant, every
# `DataValue` variant, every public item at the `Db`/crate-root boundary,
# every `DEFAULT_FIXED_RULES` registry key, every `Storage`/`StoreTx` trait
# method, and every ranked capability named in the plan's Appendix A.
# `unmapped` -- present in source but absent from this file -- is a build
# failure, checked by scripts/check-krites-capability-matrix.py in CI. A row
# with no matching source item (stale) fails the same way, so drift is caught
# both directions.
#
# `gate_test` records a candidate test as a `<binary-id>::<test path>` id
# (what `cargo nextest list` prints).
# The required hosted gate resolves every pointer against compiler-derived
# nextest output for the exact selection it then executes, and fails on one
# that names no filter-matching test or names an `#[ignore]`d one. `"none"` is
# legal and means UNPOINTED -- an honestly unpointed row is worth more than a
# pointer at a test that does not exercise the capability, and the count is
# printed rather than buried.
#
# WARNING(what a pointer proves): only that the named test exists and is
# runnable in the listed test world. Membership does not mechanically couple
# the test to this capability or prove the row's `gate` sentence -- several
# gates name conformance behaviour no current test checks. A green required
# hosted job proves the listed test world passed, not that this row's candidate
# exercised its capability.
#
# `[[capability_set]]` covers the populations too large for one row each: 139
# scalar functions, 138 DSL-reachable op names, 25 aggregations, 25
# aggregation names. Members are re-derived from source every run and compared
# for EXACT equality -- a recorded member gone from source is a dropped
# capability; a source member missing from the record is an unrecorded one.
# These replace prose counts ("All 22 fixed-rule algorithms", "~102 functions
# consuming Num") that named nothing measurable and that no check could read.
#
# WHY(appendix_a rows): the plan (canon: kanon
# projects/aletheia/phases/05g-krites-overhaul/RETIREMENT-PLAN.md, Appendix A)
# lives in a sibling repo the checker cannot read from CI. These rows are a committed
# mirror, captured at PLAN.md's Appendix A as of 33 data rows. The checker
# verifies internal completeness (row count floor, required fields, unique
# ids) in CI; `--plan-md <path>` does an optional local live-diff when both
# repos are checked out side by side (never CI-gating -- see script header).
#
# `call_sites` is a measured FLOOR with the exact command recorded in
# `call_sites_method`, never a guess. Zero call sites is never grounds to
# drop a row -- see the plan's B7 finding and kill criterion 10.
# check_call_sites_measured (scripts/check-krites-capability-matrix.py)
# re-executes every call_sites_method in CI and fails the build when the
# measurement has fallen BELOW the recorded figure -- this is not just a
# convention. A consumer being added is not a defect and does not fail;
# a consumer disappearing is exactly what the row exists to catch. Raise a
# figure only after re-running its own call_sites_method, never by
# incrementing -- an incremented number agrees with itself while being wrong.
#
# `call_sites = -1` means "not measured" and is legal only for the exact row
# ids and covered-row relationships owned by the checker. `call_sites_method`
# retains the human reason -- too generic a token/type to grep meaningfully,
# or one exact sibling row already owns the measurement -- but matrix prose
# cannot authorize a new exception. -1 is never a stand-in for a guessed 0.
#
# dest_wave values: "wave-0".."wave-12" per PLAN.md Sec 4/Sec 7; "sovereign"
# for code that already carries forward unrewritten (PLAN.md Sec 4 totals);
# "n/a" for a third-party re-export with no krites-owned gate.

# ---------------------------------------------------------------------------
# category = "sysop" -- all 19 SysOp variants, parse/sys/mod.rs:20-56.
# call_sites_method: quote-anchored grep for the literal DSL keyword (from
# datalog.pest) as an embedded script string, workspace-wide, excluding
# crates/krites/. `SysOp::<Variant>` itself has zero Rust-level call sites
# for every variant (the dispatch site is runtime/sys.rs; consumers never
# construct SysOp directly, only through parsed script text) -- so the DSL
# keyword is the only call-site signal that means anything here.
# ---------------------------------------------------------------------------

