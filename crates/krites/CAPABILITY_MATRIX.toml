# ---------------------------------------------------------------------------
# category = "storage_method" -- every method of the Storage and StoreTx
# traits, storage/mod.rs. 16 methods, not the 15 the api-fjall-storage and
# appendix-a-cross-partition-atomic-write gates used to assert: 4 on Storage
# and 12 on StoreTx. The wave-1b mem-vs-fjall differential is defined over
# exactly this set, so a miscount is a differential that silently skips a
# method.
# call_sites: -1 for the whole category. Both traits are pub(crate)
# (lib.rs:52), so no call site outside crates/krites/ can exist by
# construction, and an internal `.get(`/`.put(` grep matches every BTreeMap
# in the crate rather than the trait. What a rewrite could narrow here is a
# per-backend implementation, and that is what this category's bidirectional
# check against the trait bodies covers.
# ---------------------------------------------------------------------------

