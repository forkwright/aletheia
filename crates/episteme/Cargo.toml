[package]
name = "episteme"
version.workspace = true
description = "Knowledge pipeline for Aletheia"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["graph-algo", "reranker"]
# WHY: krites owns the graph algorithms and `mneme/graph-algo` forwards here,
# so this must forward on to krites rather than terminate. It resolves the same
# way today only because krites is depended on with default features and its
# default already includes graph-algo — the chain held by coincidence, not by
# declaration. The `?` keeps krites optional: the forward applies only when a
# feature that pulls krites in (mneme-engine) is already enabled.
graph-algo = ["krites?/graph-algo"]
# WHY: retirement PLAN.md Sec.2 land-dark/soak/delete -- consumers must be
# testable against the sovereign HNSW tree (runtime/hnsw_sovereign/) before
# the default flips, and without this passthrough it is unreachable from any
# consumer's tests, only from krites' own crate-scoped `-p krites` build. The
# `?` keeps krites optional, same as graph-algo above: the forward applies
# only once mneme-engine has already pulled krites in.
krites_sovereign_hnsw = ["krites?/krites_sovereign_hnsw"]
# WHY (aletheia#5779 §8.4/F10): the process-crash injection seam
# (`crash_injection` module) must not exist in a normal production build —
# `register_crash_hook` would otherwise be reachable public API in the
# shipped daemon, letting any in-process code install a callback that runs
# inside migration code. Non-default; enabled only by the
# `integration-tests` crate's dev-dependency for the crash-injection matrix.
crash-injection = []
reranker = ["dep:reqwest", "dep:rustls", "dep:tokio"]
gliner = ["dep:ort", "dep:tokio", "dep:tokenizers"]
nuextract = ["dep:ort", "dep:tokio", "dep:tokenizers"]
test-support = []
# WHY: mneme-engine brings in the Datalog knowledge store via krites and the
# tokio blocking-task utilities graphe's engine errors need.
mneme-engine = ["dep:krites", "dep:tokio", "graphe/mneme-engine"]
storage-fjall = ["mneme-engine", "krites/storage-fjall", "dep:fjall"]
embed-candle = ["dep:candle-core", "dep:candle-nn", "dep:candle-transformers", "dep:tokenizers", "dep:hf-hub"]
openai-embed = ["dep:reqwest", "dep:tokio", "dep:rustls"]
# WHY: candle embedding tests download config.json from HuggingFace at test
# time. macOS GitHub runners intermittently fail DNS lookup for huggingface.co
# (see #3683). Gate those network-dependent tests behind `online-tests` so the
# default CI matrix never depends on external reachability. Enable explicitly
# in scheduled or label-triggered jobs.
online-tests = []
# Test tiers (see docs/test-tiers.md)
test-core = ["mneme-engine"]
test-full = ["test-core", "embed-candle", "online-tests"]

[dependencies]
eidos = { path = "../eidos" }
graphe = { path = "../graphe", default-features = false }
koina = { path = "../koina" }
krites = { path = "../krites", optional = true }
# WHY: matches krites' pin exactly (storage/fjall_backend.rs) — the
# pre-migration snapshot verification (knowledge_store/snapshot.rs,
# aletheia#5779 §8.5) opens the same on-disk format with the same crate
# version. Re-check both Cargo.toml entries together if either changes.
fjall = { version = "=3.1.9", default-features = false, features = [
    "lz4",
], optional = true }
jiff = { workspace = true, features = ["serde"] }
parking_lot = "0.12"
prometheus-client = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true, optional = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-normalization = { version = "0.1" }

# Candle embedding dependencies
candle-core = { version = "=0.11.0", optional = true }
candle-nn = { version = "=0.11.0", optional = true }
candle-transformers = { version = "=0.11.0", optional = true }
tokenizers = { version = "0.23", optional = true, default-features = false, features = [
    "fancy-regex",
] }
ort = { version = "2.0.0-rc.12", optional = true, default-features = false, features = [
    "std",
    "ndarray",
    "tracing",
    "download-binaries",
    "tls-rustls",
    "copy-dylibs",
    "api-24",
] }
# WHY: only "ureq" needed — code uses hf_hub::api::sync::Api (blocking).
# The "tokio" feature pulled in reqwest 0.12 alongside workspace reqwest 0.13,
# compiling two full HTTP client stacks. Switching to ureq resolved the reqwest
# duplication (#2079). ureq handles TLS via its own rustls.
hf-hub = { version = "0.5", optional = true, default-features = false, features = [
    "ureq",
] }
# OpenAI-compatible embedding provider (HTTP)
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }

[dev-dependencies]
criterion = { workspace = true }
eidos = { path = "../eidos", features = ["test-support"] }
proptest = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

# WHY: extract::observation parsers run on every PR scraped by the bookkeeper.
# Track them here so regressions in the regex/tag pipeline surface in CI.
[[bench]]
name = "observation"
harness = false
