[package]
name = "agora"
version.workspace = true
description = "Channel registry and provider implementations (Signal, Matrix)"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[features]
test-core = []
test-full = []

[dependencies]
koina = { path = "../koina" }
taxis = { path = "../taxis" }
indexmap = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
futures = { workspace = true }

[dev-dependencies]
koina = { path = "../koina", features = ["test-support"] }
organon = { path = "../organon", features = ["test-support"] }
# WHY: `#[tokio::test(start_paused = true)]` (crates/agora/src/registry.rs,
# #6908) needs tokio's test-util feature to compile at all -- unrelated to
# #5194, but this crate's test target does not build without it.
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
tempfile = { workspace = true }
toml = { workspace = true }

[lints]
workspace = true
