[package]
name = "integration-tests"
version.workspace = true
publish = false
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["knowledge-store"]
engine-tests = ["mneme/mneme-engine"]
# WHY: `mneme/crash-injection` (aletheia#5779 §8.4/F10) is enabled here
# specifically because this crate hosts the migration crash-injection
# matrix (`tests/migration_crash_injection.rs`,
# `src/bin/migration_crash_child.rs`) — the one sanctioned place in the
# workspace that needs `register_crash_hook` reachable.
knowledge-store = [
    "mneme/storage-fjall",
    "mneme/crash-injection",
    "nous/knowledge-store",
    "pylon/knowledge-store",
]
# Test tiers (see docs/test-tiers.md)
test-core = ["engine-tests"]
test-full = ["test-core"]

[dependencies]
dokimion = { path = "../eval" }
koina = { path = "../koina", features = ["test-support"] }
taxis = { path = "../taxis" }
mneme = { path = "../mneme", default-features = false, features = [
    "test-support",
] }
hermeneus = { path = "../hermeneus", features = ["test-utils"] }
nous = { path = "../nous" }
organon = { path = "../organon", features = ["test-support"] }
thesauros = { path = "../thesauros" }
pylon = { path = "../pylon" }
symbolon = { path = "../symbolon" }
jiff = { workspace = true }
axum = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
http-body-util = "0.1"
indexmap = { workspace = true }
tower = { workspace = true }
