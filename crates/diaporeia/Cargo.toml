[package]
name = "diaporeia"
version.workspace = true
description = "MCP server interface — the passage through for external AI agents"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = ["knowledge-store"]
test-core = []
test-full = []
# WHY: gates the optional knowledge_store argument in NousManager::new so the
# integration tests in tests/public_api.rs can match either signature under
# workspace feature unification (#3018 follow-up). Made default because workspace
# feature unification enables nous/knowledge-store via the `aletheia` binary's
# `recall` feature — if diaporeia doesn't also enable it, the `#[cfg]` gate
# in test code evaluates incorrectly and NousManager::new gets the wrong arity.
knowledge-store = ["nous/knowledge-store", "mneme/mneme-engine"]

[dependencies]
# MCP SDK — pin exact per TECHNOLOGY.md policy
rmcp = { version = "=1.5.0", features = [
    "client",
    "server",
    "macros",
    "transport-child-process",
    "transport-io",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }
# WARNING: rmcp-macros must carry the same exact pin as rmcp. It is a separate
# crate reached through a caret requirement, so the pin above does not cover it,
# and its expansion calls rmcp runtime APIs directly -- rmcp-macros 1.8.0 emits
# `rmcp::handler::server::common::schema_for_input`, which rmcp 1.5.0 does not
# export. A lock regeneration that moves one without the other breaks every
# `#[tool]` site with a missing-function error that names neither crate (#6502).
rmcp-macros = "=3.1.4"
schemars = "1"

# HTTP (for streamable HTTP transport Axum integration, and the outbound
# client used to reach operator-configured MCP servers -- SECURITY(#4842))
axum = { workspace = true }
reqwest = { workspace = true }

# Async
tokio = { workspace = true }
tokio-util = { workspace = true }

# Time — used when knowledge-store feature is enabled for fact timestamps
jiff = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
cargo_metadata = "0.18"

# Error handling
snafu = { workspace = true }

# Observability
tracing = { workspace = true }

# HTTP types for accessing request extensions
http = { workspace = true }

# Internal crates (same layer as pylon — depends on mid+low crates)
koina = { path = "../koina" }
taxis = { path = "../taxis" }
nous = { path = "../nous" }
organon = { path = "../organon" }
mneme = { path = "../mneme" }
symbolon = { path = "../symbolon" }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
hermeneus = { path = "../hermeneus", features = ["test-utils"] }
indexmap = { workspace = true }
tempfile = { workspace = true }
tower = { workspace = true }
