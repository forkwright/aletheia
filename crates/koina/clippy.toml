# koina: foundational utility crate — must not bring in heavy dependencies
# or perform operations that belong in higher layers.

# Direct process exit bypasses cleanup; the workspace lint already denies clippy::exit
[[disallowed-methods]]
path = "std::process::exit"
reason = "do not call process::exit from library code"

[[disallowed-methods]]
path = "std::process::abort"
reason = "do not call process::abort from library code"

# Disallow types that indicate koina is reaching into layers above it
# koina must not depend on HTTP client types; that belongs in hermeneus/pylon
[[disallowed-types]]
path = "reqwest::Client"
reason = "HTTP client belongs in hermeneus or pylon, not koina"

# WHY(#5577): reqwest re-exports url::Url, so reaching for it via reqwest
# pulls the whole reqwest/hyper/rustls stack into every crate that depends on
# koina. Parse URLs through the `url` crate instead.
[[disallowed-types]]
path = "reqwest::Url"
reason = "use url::Url; reqwest drags an HTTP runtime into the foundation crate"

[[disallowed-types]]
path = "reqwest::Request"
reason = "HTTP request types belong in hermeneus or pylon, not koina"

# koina must not open SQLite connections; persistence belongs in mneme
