[package]
name = "koina"
version.workspace = true
description = "Core types, errors, and tracing for Aletheia"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
# WHY not `fjall`: an unqualified `--features fjall` (as issued by
# cargo-auditable's per-crate `cargo metadata` call) applies to every
# workspace member, and episteme's optional fjall dependency carries no
# implicit feature (`dep:` syntax), making the bare name a hard resolver
# error. The distinct name keeps the helper module reachable without
# colliding with the dependency's namespace (aletheia#6958).
fjall-helpers = ["dep:fjall", "dep:tempfile"]
# Process-wide rustls crypto provider installation (koina::crypto). Optional
# so crates with no TLS surface never pull rustls in transitively.
rustls-provider = ["dep:rustls"]
test-core = []
test-full = []
test-support = []

[dependencies]
fjall = { version = "3", default-features = false, features = ["lz4"], optional = true }
tempfile = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
jiff = { workspace = true }
rustix = { workspace = true, features = ["fs", "process"] }
regex = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
toml = { workspace = true }
zeroize = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rand = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
prometheus-client = { workspace = true }
url = { workspace = true }

[build-dependencies]
serde = { workspace = true }
toml = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "test-util"] }
criterion = { workspace = true }
tempfile = { workspace = true }
proptest = { workspace = true }

# WHY: ID generation is on every session/turn/observation hot path. Track
# regressions in the internal ULID/UUID implementations against external
# baselines so any future PR that touches them surfaces a perf delta.
[[bench]]
name = "ids"
harness = false
