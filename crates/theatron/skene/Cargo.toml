[package]
name = "skene"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Shared API client, types, SSE, and streaming infrastructure for Aletheia UIs"
publish = false

[features]
test-core = []
test-full = []

[dependencies]
koina = { path = "../../koina" }
keryx = { workspace = true }
bytes = { workspace = true }
form_urlencoded = "1"
futures-core = "0.3"
futures-util = "0.3"
reqwest = { workspace = true, features = ["stream", "cookies"] }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
# WHY(#4925): stream_message's cancellation support (the capability gap that
# justified proskenion's parallel transport loop) needs CancellationToken.
tokio-util = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }

# Shared bearer-token secret storage (#7027): OS keyring, AES-256-GCM
# encrypted fallback, atomic secure writes. WHY not `workspace = true` for
# aes-gcm/keyring/zeroize (aletheia#4726: proskenion folded into the root
# workspace, no longer a separate implicit one): the root workspace's
# `[workspace.dependencies]` table has no entry for these three, since skene
# is their only consumer; pinning them directly here instead of adding a
# workspace-wide entry for a single consumer keeps that table scoped to
# genuinely shared dependencies.
aes-gcm = "0.11"
keyring = "4"
zeroize = { version = "1", default-features = false, features = ["std"] }
bathron = { workspace = true }

[dev-dependencies]
pulldown-cmark = "0.13"
tempfile = "3"

[lints]
workspace = true

[package.metadata.kanon]
maturity = "alpha"
since = "2026-06-23"
exit-criteria = "public API stabilized with full newtype coverage for all domain identifiers"
