[package]
name = "organon"
version.workspace = true
description = "Tool registry, definitions, and built-in tool executors"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[[test]]
name = "proptest_registry"
path = "tests/proptest_registry.rs"
required-features = ["test-support"]

[[test]]
name = "spec_validation"
path = "tests/spec_validation.rs"
required-features = ["test-support"]

[[test]]
name = "energeia_tools"
path = "tests/energeia_tools.rs"
required-features = ["energeia"]

[features]
# Computer use tool: screen capture, action dispatch, Landlock sandbox.
# Not compiled by default — requires Linux kernel 5.13+ with Landlock support.
computer-use = []
# Energeia capability tools (dromeus, dokimasia, diorthosis, epitropos, parateresis,
# mathesis, prographe, schedion, metron). Wires to real energeia subsystem.
energeia = ["dep:energeia"]
# Bookkeeper tools: `katharos` worktree cleanup is implemented; `tamias`
# prompt archival remains deferred. Default OFF so deployments opt in explicitly.
bookkeeper = []
# Z3 SMT solver tool (z3_solver). Bundled so the default build doesn't pull libz3.
z3 = ["dep:z3"]
# Document/report generation tools: generate_document, lint_report,
# verify_report, render_typst_report, render_docx_report, render_pptx_report,
# render_xlsx_report, render_eval_report, render_graph_audit,
# report_runtime_health, scaffold_report, intake_report, diff_report,
# inspect_report. Pulls all 13 poiesis-* crates. `aletheia`'s own dependency
# on organon enables this unconditionally (see aletheia/Cargo.toml) so the
# deployed binary's document tools are unaffected; this feature exists so
# other organon consumers are not forced to compile the poiesis stack.
poiesis = [
    "dep:poiesis-core",
    "dep:poiesis-sheet",
    "dep:poiesis-lint",
    "dep:poiesis-slides",
    "dep:poiesis-typst",
    "dep:poiesis-scaffold",
    "dep:poiesis-verify",
    "dep:poiesis-intake",
    "dep:poiesis-doc",
    "dep:poiesis-charts",
    "dep:poiesis-theme",
    "dep:poiesis-diff",
    "dep:poiesis-inspect",
]
# Gates MockToolExecutor, ToolExecutorSpec, and other test helpers. No test code in release binaries.
test-support = ["hermeneus/test-support", "dep:rustls"]
# WHY: test-core must enable energeia so `energeia_tools` runs in the blocking gate.
test-core = ["energeia"]
test-full = ["test-core"]
# Deferred tool schemas: only tool name+description in LLM requests; full schemas
# fetched on demand via the `tool_schema` meta-tool. Default OFF so active agents
# are unaffected; operators flip this per-deployment after the flag soaks.
deferred-schemas = []
# Allow absolute paths in `{{file:...}}` interpolation. Default OFF for safety.
allow-absolute-file-refs = []

[dependencies]
eidos = { path = "../eidos" }
gnosis = { path = "../gnosis" }
graphe = { path = "../graphe" }
energeia = { path = "../energeia", optional = true, features = [
    "storage-fjall",
] }
hermeneus = { path = "../hermeneus" }
poiesis-core = { path = "../poiesis/core", optional = true }
poiesis-sheet = { path = "../poiesis/sheet", optional = true }
poiesis-lint = { path = "../poiesis/lint", optional = true }
poiesis-slides = { path = "../poiesis/slides", optional = true }
poiesis-typst = { path = "../poiesis/typst", optional = true }
poiesis-scaffold = { path = "../poiesis/scaffold", optional = true }
poiesis-verify = { path = "../poiesis/verify", optional = true }
poiesis-intake = { path = "../poiesis/intake", optional = true }
# WHY: default-features=false + explicit selection landed in #4560 (poiesis-doc
# gates its OWN internal deps behind docx/inspect/pandoc/odt/pdf-typst/charts
# features); optional=true landed here in #4559 (organon gates poiesis-doc
# itself as a whole crate). Both apply: the four features select which of
# poiesis-doc's own deps compile IF this dep is pulled in at all, and
# optional=true is what makes pulling it in conditional in the first place.
poiesis-doc = { path = "../poiesis/doc", optional = true, default-features = false, features = [
    "docx",
    "inspect",
    "pandoc",
    "odt",
] }
poiesis-charts = { path = "../poiesis/charts", optional = true, features = [
    "theme-bridge",
] }
poiesis-theme = { path = "../poiesis/theme", optional = true }
poiesis-diff = { path = "../poiesis/diff", optional = true }
poiesis-inspect = { path = "../poiesis/inspect", optional = true }
koina = { path = "../koina" }
taxis = { path = "../taxis" }
base64 = { workspace = true }
getrandom = "0.3"
indexmap = { workspace = true }
hmac = { workspace = true }
jiff = { workspace = true }
prometheus-client = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
regex = { workspace = true }
serde_json = { workspace = true }
rand = { workspace = true }
sha2 = { workspace = true }
snafu = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
which = "8"
zip = { version = "=8.5.1", default-features = false, features = ["deflate"] }
z3 = { version = "0.20", optional = true, features = ["bundled"] }

[dependencies.rustls]
workspace = true
optional = true

[dev-dependencies]
energeia = { path = "../energeia", features = ["storage-fjall"] }
fjall = { version = "3", default-features = false, features = ["lz4"] }
indexmap = { workspace = true }
libc = { workspace = true }
proptest = { workspace = true }
rustls = { workspace = true }
snafu = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4"
rustix = { workspace = true, features = ["process", "thread"] }
seccompiler = "0.5"

[lints]
workspace = true

[package.metadata.kanon]
maturity = "production"
since = "2024-01-01"
exit-criteria = "decommission with the aletheia tool execution layer"
