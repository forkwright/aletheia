# WHY(#5423): Cross 0.2.5 treats `auditable` as an unknown host-only Cargo
# subcommand.  The pre-build instead makes the container's `cargo` command an
# auditable wrapper, so the recognized `cross build` path stays inside the
# target image and embeds dependency data in the shipped binary.
[build]
pre-build = "./scripts/install-cargo-auditable-cross.sh"
